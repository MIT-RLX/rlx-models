name: fmt-clippy

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # `--all-targets` builds rlx-gemma-inflect-nano's cpal dev-dependency,
      # which needs ALSA headers; without this the gate fails in alsa-sys's
      # build script before it lints a single crate.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # rustdoc's link lints are warn-by-default and nothing else here runs
      # rustdoc, so a broken `[`Thing`]` ships as literal brackets. Default
      # features, which is also what docs.rs builds (no crate sets
      # `[package.metadata.docs.rs]`), so this matches the published docs.
      # --keep-going: rustdoc stops at the first failing crate otherwise.
      - name: cargo doc (-D warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --keep-going
      # MODELS.md is hand-maintained but claims to be generated from each
      # crate's Cargo.toml, and drifts every release (missing crates, stale
      # backend cells, counts that no longer add up). Cheap: metadata only.
      - name: MODELS.md catalog
        run: python3 scripts/check-models-catalog.py
      # Publish-blocking classes that no cargo command catches: includes that
      # escape their package or are gitignored, versionless path deps, oversized
      # crates, and publish.sh tier coverage/ordering.
      - name: publish preflight
        run: python3 scripts/check-publishable.py
