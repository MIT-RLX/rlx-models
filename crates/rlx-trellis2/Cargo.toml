[package]
name = "rlx-trellis2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Microsoft TRELLIS.2-4B image-to-3D (flow-matching DiTs + sparse-3D-conv VAEs + dual-grid mesh extraction) native port for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-ir = { workspace = true }
rlx-flow = { workspace = true }
rlx-runtime = { workspace = true }
rlx-opt = { workspace = true }
rlx-cpu = { workspace = true }
rlx-dinov3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
safetensors = { workspace = true }
half = { workspace = true }
bytemuck = { workspace = true }
anyhow = { workspace = true }
image = { workspace = true }
hf-hub = { workspace = true, optional = true }

[dev-dependencies]
safetensors = { workspace = true }

[[bin]]
name = "rlx-trellis2"
path = "src/bin/rlx_trellis2.rs"

[lints]
workspace = true

[features]
default = []
hf-download = ["dep:hf-hub"]
metal = ["rlx-runtime/metal", "rlx-dinov3/metal"]
mlx = ["rlx-runtime/mlx", "rlx-dinov3/mlx"]
cuda = ["rlx-runtime/cuda", "rlx-dinov3/cuda"]
rocm = ["rlx-runtime/rocm", "rlx-dinov3/rocm"]
gpu = ["rlx-runtime/gpu", "rlx-dinov3/gpu"]
vulkan = ["rlx-runtime/vulkan", "rlx-dinov3/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]
