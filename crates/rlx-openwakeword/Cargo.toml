[package]
name = "rlx-openwakeword"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Native openWakeWord wake-word pipeline on RLX (ONNX parity optional)"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-wake = { workspace = true }
rlx-runtime = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
rlx-nanowakeword = { workspace = true }
rlx-porcupine = { workspace = true }
rlx-voxrt = { workspace = true }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = [
    "std",
    "pkg-config",
    "download-binaries",
    "tls-rustls",
] }

[features]
default = []
onnx = ["dep:ort"]
all-backends = ["rlx-wake/all-backends", "metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
metal = ["rlx-runtime/metal", "rlx-wake/metal"]
mlx = ["rlx-runtime/mlx", "rlx-wake/mlx"]
cuda = ["rlx-runtime/cuda", "rlx-wake/cuda"]
rocm = ["rlx-runtime/rocm", "rlx-wake/rocm"]
gpu = ["rlx-runtime/gpu", "rlx-wake/gpu"]
vulkan = ["rlx-runtime/vulkan", "rlx-wake/vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]

[[bin]]
name = "rlx-openwakeword"
path = "src/bin/rlx_openwakeword.rs"

[[bin]]
name = "rlx-openwakeword-train"
path = "src/bin/rlx_openwakeword_train.rs"

[[example]]
name = "engines_bench"
path = "examples/engines_bench.rs"

[[test]]
name = "native_quick"
path = "tests/native_quick.rs"

[[test]]
name = "onnx_parity"
path = "tests/onnx_parity.rs"
required-features = ["onnx"]

[[test]]
name = "backend_quick_check"
path = "tests/backend_quick_check.rs"

[[test]]
name = "backend_parity"
path = "tests/backend_parity.rs"

[lints]
workspace = true
