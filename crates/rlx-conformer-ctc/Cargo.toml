[package]
name = "rlx-conformer-ctc"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
readme = "README.md"
description = "NVIDIA NeMo Conformer-CTC ASR (e.g. stt_en_conformer_ctc_small) on RLX, loaded natively from .nemo"
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow      = { workspace = true }
rlx-core    = { workspace = true }
rlx-cli     = { workspace = true }
rlx-flow    = { workspace = true }
rlx-ir      = { workspace = true }
rlx-runtime = { workspace = true }
rlx-nemo    = { workspace = true }
rustfft     = "6"

[features]
default = []
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
coreml = ["rlx-runtime/coreml"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[[bin]]
name = "rlx-conformer-ctc"
path = "src/bin/rlx_conformer_ctc.rs"

[[example]]
name = "backend_matrix"
path = "examples/backend_matrix.rs"

[lints]
workspace = true
