# The VAD's host logic as an RLX program (WebAssembly): the frames, the
# streaming context and the recurrent state around the package's step graph,
# then the speech segments. Built by `rlx-vad`'s exporter, so it stands
# outside the workspace.
[package]
name = "rlx-vad-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
serde_json = "1"
anyhow = "1"

# `segments.rs` gates the crate's own detectors on these; never enabled here.
[features]
earshot = []
silero = []

[workspace]
