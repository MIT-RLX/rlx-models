[package]
name = "rlx-vad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Voice activity detection (Earshot + Silero) on RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true, optional = true }
rlx-ir = { workspace = true }
rlx-flow = { workspace = true }
rlx-runtime = { workspace = true }
rlx-cpu = { workspace = true }
anyhow = { workspace = true }

[[bin]]
name = "rlx-vad"
path = "src/bin/rlx_vad.rs"

[[example]]
name = "jfk_bench"
path = "examples/jfk_bench.rs"

[[example]]
name = "jfk_probe"
path = "examples/jfk_probe.rs"

[[test]]
name = "earshot_quick"
path = "tests/earshot_quick.rs"
required-features = ["earshot"]

[[test]]
name = "silero_quick"
path = "tests/silero_quick.rs"
required-features = ["silero"]

[[test]]
name = "backend_quick_check"
path = "tests/backend_quick_check.rs"

[[test]]
name = "e2e_jfk"
path = "tests/e2e_jfk.rs"

[features]
default = ["earshot", "silero"]
earshot = []
silero = ["dep:rlx-core"]
hf-download = ["dep:hf-hub"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[dependencies.hf-hub]
workspace = true
optional = true

[lints]
workspace = true
