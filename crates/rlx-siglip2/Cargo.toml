[package]
name = "rlx-siglip2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "SigLIP 2 (fixed-resolution + NaFlex) image + text encoder for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
rlx-opt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
safetensors = { workspace = true }
image = { workspace = true }
half = { workspace = true }
tokenizers = { workspace = true }

[dev-dependencies]
# The export test opens the package as any rlx program does.
tempfile = "3"

[[bin]]
name = "rlx-siglip2"
path = "src/bin/rlx_siglip2.rs"

[lints]
workspace = true

[features]
default = []
# `export::export_rlxp`: a checkpoint as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
macos-gpu = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]
