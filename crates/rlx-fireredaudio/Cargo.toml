[package]
name = "rlx-fireredaudio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "FireRedAudio unified audio LM on RLX — Qwen3.5 backbone + Whisper-style encoder; ASR/understand E2E, RedAE/DiT generation next"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-ir = { workspace = true }
rlx-flow = { workspace = true }
rlx-runtime = { workspace = true }
rlx-whisper = { workspace = true }
rlx-qwen35 = { workspace = true }
rustfft = "6"
tokenizers = { workspace = true, optional = true }

[[bin]]
name = "rlx-fireredaudio"
path = "src/bin/rlx_fireredaudio.rs"

[features]
default = ["tokenizer"]
tokenizer = ["dep:tokenizers"]
# `export::export_rlxp`: the understanding path as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export", "rlx-qwen35/export", "tokenizer"]
metal = ["rlx-runtime/metal", "rlx-qwen35/metal"]
mlx = ["rlx-runtime/mlx", "rlx-qwen35/mlx"]
coreml = ["rlx-runtime/coreml", "rlx-qwen35/coreml"]
cuda = ["rlx-runtime/cuda", "rlx-qwen35/cuda"]
rocm = ["rlx-runtime/rocm", "rlx-qwen35/rocm"]
gpu = ["rlx-runtime/gpu", "rlx-qwen35/gpu"]
vulkan = ["rlx-runtime/vulkan", "rlx-qwen35/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
macos-gpu = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[dev-dependencies]
tempfile = "3"
rlx-text = { workspace = true }
# The package's program (`tests/export_rlxp.rs`).
rlx-runtime = { workspace = true, features = ["program"] }

[lints]
workspace = true
