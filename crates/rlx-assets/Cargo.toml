[package]
name = "rlx-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Versatile model-asset loading for RLX (directory / packed file / in-memory / config / custom provider)"
keywords.workspace = true
categories.workspace = true

# Deliberately lean — no rlx compiler/runtime deps — so any model crate (even
# host-eager / iOS builds) can adopt versatile bundle loading cheaply.
[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
memmap2 = "0.9"

