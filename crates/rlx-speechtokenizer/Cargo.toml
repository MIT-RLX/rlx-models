[package]
name = "rlx-speechtokenizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "SpeechTokenizer (fnlp/SpeechTokenizer) RVQ speech codec for RLX — multi-backend"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
safetensors = { workspace = true }
rlx-core = { workspace = true }
rlx-runtime = { workspace = true }
rlx-ir = { workspace = true }
rlx-metal = { workspace = true, optional = true }
rlx-mlx = { workspace = true, optional = true }
rlx-wgpu = { workspace = true, optional = true }

[features]
default = []
cpu = ["rlx-runtime/cpu"]
metal = ["rlx-runtime/metal", "dep:rlx-metal", "rlx-core/metal"]
mlx = ["rlx-runtime/mlx", "dep:rlx-mlx", "rlx-core/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu", "dep:rlx-wgpu", "rlx-core/gpu"]
vulkan = ["rlx-runtime/vulkan", "dep:rlx-wgpu"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
macos-gpu = ["metal", "mlx", "gpu"]
# `export::export_rlxp`: a checkpoint as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
