[package]
name = "rlx-jlens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Jacobian lens — read out what an RLX model's internal activations are disposed to say"
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
thiserror = "2"
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
rlx-autodiff = { workspace = true }
safetensors = { workspace = true }
half = { workspace = true }
# Model implementations are optional: the core crate depends on no model.
rlx-qwen35 = { workspace = true, optional = true }
rlx-qwen3 = { workspace = true, optional = true }
rlx-dinov3 = { workspace = true, optional = true }
rlx-siglip2 = { workspace = true, optional = true }
rlx-qwen25-vl = { workspace = true, optional = true }
image = { workspace = true, optional = true }
# Only the qwen3 model needs a weight loader in the library itself; the qwen35
# one is handed already-materialized weights by its caller.
rlx-core = { workspace = true, optional = true }

[dev-dependencies]
rlx-qwen35 = { workspace = true }
rlx-qwen3 = { workspace = true }
rlx-core = { workspace = true }

[features]
# No model is enabled by default — pick the ones you need.
default = []
qwen3 = ["dep:rlx-qwen3", "dep:rlx-core"]
dinov3 = ["dep:rlx-dinov3", "dep:rlx-core", "render"]
siglip2 = ["dep:rlx-siglip2", "dep:rlx-core", "render"]
qwen25-vl = ["dep:rlx-qwen25-vl", "dep:rlx-core", "render"]
# Heatmap overlays and contact sheets (`heatmap` module). Named rather than
# implied by `dep:image` so the render code has one cfg to key off.
render = ["dep:image"]
qwen35 = ["dep:rlx-qwen35"]
# GGUF-vocab tokenization, for the readout example.
qwen35-tokenizer = ["qwen35", "rlx-qwen35/qwen35-tokenizer"]
all-models = ["qwen3", "qwen35", "dinov3", "siglip2"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[lints]
workspace = true

[[example]]
name = "lens_readout"
required-features = ["qwen35", "qwen35-tokenizer"]

[[example]]
name = "fit_corpus"
required-features = ["qwen35", "qwen35-tokenizer"]

[[example]]
name = "lens_probe"
required-features = ["qwen35", "qwen35-tokenizer"]

[[example]]
name = "eval_lens"
required-features = ["qwen35", "qwen35-tokenizer"]

[[example]]
name = "lens_greediness"
required-features = ["qwen35", "qwen35-tokenizer"]

[[example]]
name = "dump_qwen3_jacobians"
required-features = ["qwen3"]

[[example]]
name = "cfgtest"
required-features = ["qwen3"]

[[example]]
name = "dino_lens"
required-features = ["dinov3"]

[[example]]
name = "stream_growth"
required-features = ["siglip2"]

[[example]]
name = "vl_lens"
required-features = ["qwen25-vl"]

[[example]]
name = "vl_bisect"
required-features = ["qwen25-vl"]

[[example]]
name = "vl_focus"
required-features = ["qwen25-vl"]

[[example]]
name = "vl_layer_map"
required-features = ["qwen25-vl"]

[[example]]
name = "vl_patch_order"
required-features = ["qwen25-vl"]

[[example]]
name = "vl_report"
required-features = ["qwen25-vl"]
