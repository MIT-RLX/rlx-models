# sanoTTS's host logic as an RLX program (WebAssembly, wasm32-wasip1): the
# phonemizer, the phoneme ids, the durations' rounding and the expansion to
# frames between the package's graphs. Built by `rlx-sanotts`'s exporter, so
# it stands outside the workspace.
[package]
name = "rlx-sanotts-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
serde_json = "1"
espeak-ng = { version = "0.2.0", default-features = false }
unicode-normalization = "0.1"

[workspace]
