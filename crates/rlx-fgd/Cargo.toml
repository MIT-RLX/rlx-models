[package]
name = "rlx-fgd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Functional gradient descent with adaptive representations (arXiv:2606.16926) — Algorithm 1, its convergence theory, and all four experiments: L2 fitting, RKHS regression, the wave equation, radiance fields (unpublished)"
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
rayon = "1.10"
serde_json = { workspace = true }
image = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }

[features]
default = []
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[[example]]
name = "teaser"
path = "examples/teaser.rs"

[[example]]
name = "kernel_regression"
path = "examples/kernel_regression.rs"

[[example]]
name = "wave_equation"
path = "examples/wave_equation.rs"

[[example]]
name = "radiance"
path = "examples/radiance.rs"

[[test]]
name = "theory"
path = "tests/theory.rs"

[[test]]
name = "adaptive_vs_fixed"
path = "tests/adaptive_vs_fixed.rs"

[[test]]
name = "radiance"
path = "tests/radiance.rs"

[[test]]
name = "backend_parity"
path = "tests/backend_parity.rs"

[lints]
workspace = true
