# Qwen3 compile profile — tier-1 config (optional).
# Colocate with weights as `qwen3.rlx.toml`.

[fusion]
policy = "direct"
target = "auto"
assert_clean = false
skip = false

[passes]
dce = true
constant_folding = true
verbose = false

[precision]
compute = "f32"
mixed = "none"

[backend.metal]
skip_fusion = false
unfuse_regions = false

[backend.cpu]
unfuse_regions = true
