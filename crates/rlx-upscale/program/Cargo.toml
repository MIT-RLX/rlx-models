# The upscaler's host logic as an RLX program (WebAssembly): the tile plan,
# the 8-bit conversion and the alpha channel around the package's network.
# Built by `rlx-upscale`'s exporter, so it stands outside the workspace.
[package]
name = "rlx-upscale-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
serde_json = "1"
anyhow = "1"

[workspace]
