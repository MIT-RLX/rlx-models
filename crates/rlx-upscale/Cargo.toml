[package]
name = "rlx-upscale"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Single-image super-resolution for RLX — ESRGAN / Compact / SPAN / SPANV2 / PLKSR / RealPLKSR / SAFMN / RealCUGAN (efficient CNNs) and OmniSR / SwinIR / Swin2SR / HAT / DRCT / DAT / MambaIRv2 (transformers), with tiled low-memory inference"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
# Community upscaler weights ship as bare PyTorch `.pth` state dicts.
rlx-torch-ckpt = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
image = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
# The export test opens the package, its tiling a program.
rlx-runtime = { workspace = true, features = ["program"] }

[[bin]]
name = "rlx-upscale"
path = "src/bin/rlx_upscale.rs"
required-features = ["image-io"]

# Every example that touches an image needs `image-io` (on by default).
# Declared explicitly so `cargo test --no-default-features` skips them instead
# of failing to compile. `op_coverage` is deliberately absent from this list:
# it only builds graphs and prints op names, so it stays runnable in a
# no-default-features build — which is where you most want to ask what a
# backend would need.
[[example]]
name = "upscale"
required-features = ["image-io"]

[[example]]
name = "identify"
required-features = ["image-io"]

[[example]]
name = "tile_sweep"
required-features = ["image-io"]

[[example]]
name = "compare_models"
required-features = ["image-io"]

[[example]]
name = "gallery"
required-features = ["image-io"]

[lints]
workspace = true

[features]
default = ["image-io"]
# PNG/JPEG decode + encode for the CLI and `Upscaler::upscale_file`.
image-io = ["dep:image"]
# `export::export_rlxp`: a checkpoint as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
# Neural Engine via CoreML. Also needs `rlx-core/coreml`, which is what
# lets `Device::Ane` past the device validator — without it the backend builds
# but every entry point rejects the device.
coreml = ["rlx-runtime/coreml", "rlx-core/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
macos-gpu = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]
