# MiniCPM-V's host logic as an RLX program (WebAssembly): the pictures
# sliced, the chat prompt and its placeholders, each crop's feeds, the canvas
# positions, and the prompt and reply run through the package's step.
# Built by `rlx-minicpm-v`'s exporter, so it stands outside the workspace.
[package]
name = "rlx-minicpm-v-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
anyhow = "1"
serde_json = "1"
# `preprocess.rs` reads `rlx_core::image_preprocess`: that one file, under
# the name it is imported by.
rlx-core = { package = "rlx-minicpm-v-core", path = "core" }

[workspace]
