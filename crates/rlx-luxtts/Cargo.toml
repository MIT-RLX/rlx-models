[package]
name = "rlx-luxtts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "LuxTTS (ZipVoice-distill flow-matching voice cloning) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-ir = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hound = "3"
rustfft = "6"
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
# Native RLX runner engine (import → compile_named → run_typed) for the 3 luxtts
# subgraphs — same engine as rlx-supertonic.
rlx-tiny-tts = { workspace = true }
# Bundled espeak-ng phonemizer only (reused; LuxTTS is a char-level espeak-IPA
# tokenizer like KittenTTS).
rlx-kittentts = { path = "../rlx-kittentts", version = "0.2.19", default-features = false }
rlx-core = { workspace = true, optional = true }
espeak-ng = { version = "0.2.0", optional = true, default-features = false, features = ["bundled-data-en"] }
tempfile = { version = "3", optional = true }

[dependencies.hf-hub]
workspace = true
optional = true

[features]
# Native RLX only (espeak frontend for tokenization). The former `onnx` feature
# (ONNX Runtime reference path) has been removed — the crate runs natively.
default = ["espeak"]
# We only use rlx-kittentts's espeak phonemizer, but its `BackendKind` requires a
# backend feature to compile; `native` is the ort-free one (we don't call it).
espeak = ["rlx-kittentts/espeak", "rlx-kittentts/native"]
metal = ["rlx-runtime/metal", "rlx-tiny-tts/metal", "rlx-kittentts/metal"]
mlx = ["rlx-runtime/mlx", "rlx-tiny-tts/mlx", "rlx-kittentts/mlx"]
cuda = ["rlx-runtime/cuda", "rlx-tiny-tts/cuda", "rlx-kittentts/cuda"]
gpu = ["rlx-runtime/gpu", "rlx-tiny-tts/gpu", "rlx-kittentts/gpu"]
vulkan = ["rlx-runtime/vulkan", "rlx-tiny-tts/vulkan"]
coreml = ["rlx-runtime/coreml", "rlx-tiny-tts/coreml"]
all-backends = ["metal", "mlx", "cuda", "gpu", "vulkan", "coreml"]
macos-gpu = ["metal", "mlx", "gpu", "coreml"]
hf-download = ["dep:hf-hub"]
# `export::export_rlxp`: LuxTTS as an `.rlxp` package (its graphs rlx IR —
# the log-mel and the ISTFT too — its frontend and flow-matching loop a
# program).
export = ["espeak", "dep:rlx-core", "rlx-core/export", "dep:espeak-ng", "dep:tempfile"]

[dev-dependencies]
rlx-runtime = { workspace = true, features = ["program"] }
rlx-whisper = { workspace = true }

[[bin]]
name = "rlx-luxtts"
path = "src/bin/rlx_luxtts.rs"
required-features = ["espeak"]

[lints]
workspace = true
