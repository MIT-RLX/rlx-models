[package]
name = "rlx-luxtts"
version = "0.2.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "LuxTTS (ZipVoice-distill flow-matching voice cloning) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hound = "3"
rustfft = "6"
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
# Bundled espeak-ng phonemizer + ONNX Runtime EP selector (reused; LuxTTS is a
# char-level espeak-IPA tokenizer like KittenTTS).
rlx-kittentts = { path = "../rlx-kittentts", default-features = false }

[dependencies.hf-hub]
workspace = true
optional = true

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = [
    "std",
    "pkg-config",
    "download-binaries",
    "tls-rustls",
] }

[features]
default = ["onnx", "espeak"]
onnx = ["dep:ort", "rlx-kittentts/onnx"]
espeak = ["rlx-kittentts/espeak"]
metal = ["rlx-runtime/metal", "rlx-kittentts/metal", "rlx-kittentts/ort-coreml"]
mlx = ["rlx-runtime/mlx", "rlx-kittentts/mlx", "rlx-kittentts/ort-coreml"]
cuda = ["rlx-runtime/cuda", "rlx-kittentts/cuda", "rlx-kittentts/ort-cuda"]
gpu = ["rlx-runtime/gpu", "rlx-kittentts/gpu"]
all-backends = ["metal", "mlx", "cuda", "gpu"]
apple-silicon = ["metal", "mlx", "gpu"]
hf-download = ["dep:hf-hub"]

[dev-dependencies]
rlx-whisper = { workspace = true }

[[bin]]
name = "rlx-luxtts"
path = "src/bin/rlx_luxtts.rs"
required-features = ["onnx"]

[lints]
workspace = true
