[package]
name = "rlx-qwen3-ps5"
version = "0.2.19"
edition = "2024"
publish = false
license = "GPL-3.0-only"
description = "Qwen3 GGUF decode on a jailbroken PS5's CPU — an rlx-ps5 payload"

# Standalone: cross-built for the PS5 by rlx's `just ps5 build --manifest-path`,
# so it stays out of the rlx-models workspace build and CI.
[workspace]

[[bin]]
name = "qwen3-ps5"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rlx-qwen3 = { path = "../rlx-qwen3" }
rlx-gguf = "^0.2.19"
# The PS5 platform layer (thread count, weight locking, _exit, compat shims,
# portable-gemm). Expects rlx checked out next to rlx-models.
rlx-ps5 = { path = "../../../rlx/crates/backends/rlx-ps5" }

[profile.release]
debug = 1

# rlx-models pins published rlx; rlx-ps5 is local. Put every rlx crate on the
# local checkout so the graph holds ONE copy of each — otherwise the
# `RLX_WORKERS` that `rlx_ps5::init()` sets lands in a different rlx-ir than the
# one rlx-cpu reads.
[patch.crates-io]
rlx = { path = "../../../rlx/crates/rlx" }
rlx-autodiff = { path = "../../../rlx/crates/core/rlx-autodiff" }
rlx-bake = { path = "../../../rlx/crates/io/rlx-bake" }
