# MioTTS's host logic as an RLX program (WebAssembly): the chat prompt, the
# speech codes out of the language model's ids, the codec around the
# package's graphs. Built by `rlx-miotts`'s exporter, so it stands outside
# the workspace.
[package]
name = "rlx-miotts-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
serde_json = "1"

[workspace]
