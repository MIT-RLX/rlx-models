[package]
name = "rlx-zipvoice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ZipVoice (k2-fsa flow-matching voice cloning) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
hound = "3"
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
# ZipVoice and LuxTTS share the exact ZipVoice runtime (LuxTTS is ZipVoice-distill
# fine-tuned); reuse the rlx-luxtts runner + DSP wholesale.
rlx-luxtts = { path = "../rlx-luxtts", version = "0.2.19" }
rlx-core = { workspace = true, optional = true }

[features]
default = []
metal = ["rlx-runtime/metal", "rlx-luxtts/metal"]
mlx = ["rlx-runtime/mlx", "rlx-luxtts/mlx"]
cuda = ["rlx-runtime/cuda", "rlx-luxtts/cuda"]
gpu = ["rlx-runtime/gpu", "rlx-luxtts/gpu"]
all-backends = ["metal", "mlx", "cuda", "gpu"]
# `export::export_rlxp`: ZipVoice as an `.rlxp` package (LuxTTS' exporter,
# ZipVoice's sampler defaults).
export = ["rlx-luxtts/export", "dep:rlx-core"]

[dev-dependencies]
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true, features = ["program"] }
serde_json = { workspace = true }
tempfile = "3"
rlx-whisper = { workspace = true }

[[bin]]
name = "rlx-zipvoice"
path = "src/bin/rlx_zipvoice.rs"

[lints]
workspace = true
