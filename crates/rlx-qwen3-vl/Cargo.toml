[package]
name = "rlx-qwen3-vl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Qwen3-VL for RLX — the runner's text path works (dense or MoE LM), its vision tower is incomplete; `export` writes a full dense package (vision tower, deepstack, multimodal RoPE)"
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = { workspace = true }
rlx-core = { workspace = true }
rlx-llama-base = { workspace = true }
rlx-vlm-base = { workspace = true }
rlx-cli = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
rlx-gguf = { workspace = true }
rlx-qwen3 = { workspace = true }
rlx-qwen35 = { workspace = true, features = ["tokenizer"] }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# `export::export_rlxp`: a checkpoint as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export", "rlx-qwen3/export"]
metal = ["rlx-runtime/metal"]

[dev-dependencies]
# The export test opens the package as any rlx program does.
rlx-text = { workspace = true }
tempfile = "3"

[lints]
workspace = true
