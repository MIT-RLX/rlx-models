# Kyutai TTS's host logic as an RLX program (WebAssembly): the crate's own
# `generate.rs`, `state_machine.rs`, `delays.rs` and `sampling.rs` over the
# package's graphs. Built by `rlx-kyutai-tts`'s exporter, so it stands
# outside the workspace.
[package]
name = "rlx-kyutai-tts-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
serde_json = "1"
anyhow = "1"
ndarray = "0.16"
rand = { version = "0.8", default-features = false, features = ["alloc", "std_rng"] }
half = "2"
rlx-ir = { version = "0.2.19", default-features = false, features = ["std"] }

[workspace]
