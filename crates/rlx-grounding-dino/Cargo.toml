[package]
name = "rlx-grounding-dino"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Grounding DINO (IDEA-Research/grounding-dino-base) for RLX"
repository.workspace = true

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-bert = { workspace = true }
rlx-ir = { workspace = true }
rlx-flow = { workspace = true }
rlx-gguf = { workspace = true }
rlx-runtime = { workspace = true }
rlx-opt = { workspace = true }
rlx-cpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
safetensors = { workspace = true }
image = { workspace = true }
tokenizers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
# Metal's deformable-attention kernel auto-registers in rlx-metal (pulled
# transitively via rlx-runtime/metal), so no direct rlx-metal dep is needed.
# MLX still registers its kernel consumer-side under the `rlx-mlx` feature.
rlx-mlx = { workspace = true, optional = true }

[[bin]]
name = "rlx-grounding-dino"
path = "src/bin/rlx_grounding_dino.rs"

[lints]
workspace = true

[features]
default = ["tokenizer", "hf-cache"]
tokenizer = ["dep:tokenizers"]
hf-cache = ["dep:hf-hub"]
hf-download = ["hf-cache"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]
# On-device deformable-attention. Metal auto-registers its kernel (so `metal`
# alone suffices); MLX registers consumer-side, so it needs the `rlx-mlx` dep;
# WGPU dispatches the op via the engine's Step table.
engine-kernels = []
engine-apple = ["engine-kernels", "metal", "mlx", "rlx-mlx"]
engine-wgpu = ["engine-kernels", "gpu"]
