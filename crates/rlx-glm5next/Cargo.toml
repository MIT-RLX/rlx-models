[package]
name = "rlx-glm5next"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "GLM-5.3-Flash (glm5next) — hybrid KDA + NoPE-MLA/DSA attention, mHC residuals and a 288-expert clamped-SwiGLU MoE — for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-core = { workspace = true }
rlx-cpu = { workspace = true }
rlx-distributed = { workspace = true }
rlx-flow = { workspace = true }
rlx-gguf = { workspace = true }
rlx-ir = { workspace = true }
rlx-llada2 = { workspace = true }
rlx-runtime = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rlx-cli = { workspace = true }

[lints]
workspace = true

[features]
default = []
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
coreml = ["rlx-runtime/coreml", "rlx-core/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]
