[package]
name = "rlx-funasr"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description = "FunASR (Paraformer, SenseVoiceSmall, FSMN-VAD, CT-Transformer punctuation, CAM++ speaker) ported to Rust on RLX — all backends"

[dependencies]
anyhow       = { workspace = true }
rlx-core     = { workspace = true }
rlx-cli      = { workspace = true }
rlx-flow     = { workspace = true }
rlx-ir       = { workspace = true }
rlx-runtime  = { workspace = true }
rlx-opt      = { workspace = true }
rlx-nemo     = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
safetensors  = { workspace = true }
half         = { workspace = true }
rustfft      = "6"
zip          = { version = "2.2", default-features = false, features = ["deflate"] }
symphonia    = { version = "0.5", default-features = false, features = ["mp3", "isomp4", "aac", "flac"] }

[features]
default = []
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
coreml = ["rlx-runtime/coreml"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[[bin]]
name = "rlx-funasr"
path = "src/bin/rlx_funasr.rs"

[lints]
workspace = true
