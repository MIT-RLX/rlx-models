[package]
name = "rlx-narma10"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "NARMA-10 reference generator, ESN predictors, and RLX backend parity (unpublished)"
publish = false

[dependencies]
anyhow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }

[features]
default = []
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[[example]]
name = "bench_predictors"
path = "examples/bench_predictors.rs"

[[test]]
name = "backend_parity"
path = "tests/backend_parity.rs"

[[test]]
name = "predictor_benchmark"
path = "tests/predictor_benchmark.rs"

[[test]]
name = "esn_protocol_parity"
path = "tests/esn_protocol_parity.rs"

[lints]
workspace = true
