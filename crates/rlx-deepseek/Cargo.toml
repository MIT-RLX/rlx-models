[package]
name = "rlx-deepseek"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "DeepSeek-V3 / V3.1 (MLA + fine-grained MoE), incl. Kimi-K2, for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
rlx-llada2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
safetensors = { workspace = true }
half = { workspace = true }
tokenizers = { workspace = true }

[[bin]]
name = "rlx-deepseek"
path = "src/bin/rlx_deepseek.rs"

[lints]
workspace = true

[features]
default = []
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
coreml = ["rlx-runtime/coreml", "rlx-core/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]
