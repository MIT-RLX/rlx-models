[package]
name = "rlx-tada"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "HumeAI TADA (Text-Acoustic Dual Alignment) speech-language model for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
half = { workspace = true }
libc = "0.2"
ndarray = "0.16"
hound = "3"
clap = { version = "4", features = ["derive"] }

rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
rlx-core = { workspace = true }
rlx-dac = { workspace = true }
rlx-llama32 = { workspace = true }

[dependencies.tokenizers]
workspace = true
optional = true

[dependencies.hf-hub]
workspace = true
optional = true

[features]
default = ["tokenizer"]
# Llama-3 BPE tokenizer for the text front end. Without it the crate
# synthesizes from caller-supplied token ids.
tokenizer = ["dep:tokenizers"]
hf-download = ["dep:hf-hub"]

metal = ["rlx-runtime/metal", "rlx-dac/metal", "rlx-llama32/metal"]
mlx = ["rlx-runtime/mlx", "rlx-dac/mlx", "rlx-llama32/mlx"]
cuda = ["rlx-runtime/cuda", "rlx-dac/cuda", "rlx-llama32/cuda"]
rocm = ["rlx-runtime/rocm", "rlx-dac/rocm", "rlx-llama32/rocm"]
gpu = ["rlx-runtime/gpu", "rlx-dac/gpu", "rlx-llama32/gpu"]
vulkan = ["rlx-runtime/vulkan", "rlx-dac/vulkan", "rlx-llama32/vulkan"]
# CoreML / ANE. `rlx-dac` has no CoreML feature of its own, but the backend
# registry is global — enabling it on `rlx-runtime` links the implementation for
# every graph in the process, including the codec's.
coreml = ["rlx-runtime/coreml", "rlx-core/coreml", "rlx-llama32/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[[bin]]
name = "rlx-tada"
path = "src/bin/rlx_tada.rs"

[lints]
workspace = true
