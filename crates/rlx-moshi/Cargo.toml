[package]
name = "rlx-moshi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Kyutai Moshi speech-to-speech LM (Helium + depth transformer) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ndarray = "0.16"
hound = "3"
rand = "0.8"
rayon = "1.10"
sentencepiece = "0.11"

rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-ir = { workspace = true }
rlx-mimi = { workspace = true }
rlx-runtime = { workspace = true }

# Native MLX safetensors loading (always compiled).
safetensors = { version = "0.4.5" }

tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "net"], optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
futures-util = { version = "0.3", optional = true }
# Live mic capture + speaker playback for the `moshi_voice_chat` example.
cpal = { version = "0.15", optional = true }

[dependencies.hf-hub]
workspace = true
optional = true

[features]
default = ["cli", "tokio"]
cli = []
hf-download = ["dep:hf-hub"]
tokio = ["dep:tokio"]
ws-server = ["tokio", "dep:axum", "dep:futures-util"]

# Backends are fully native RLX (LM via RlxLm + Mimi codec), candle-free. The LM
# uses the native graph backend on any non-CPU device (or `RLX_MOSHI_NATIVE=1`).
metal = ["rlx-runtime/metal", "rlx-mimi/metal"]
mlx = ["rlx-runtime/mlx", "rlx-mimi/mlx"]
cuda = ["rlx-runtime/cuda", "rlx-mimi/cuda"]
rocm = ["rlx-runtime/rocm", "rlx-mimi/rocm"]
vulkan = ["rlx-runtime/vulkan", "rlx-mimi/vulkan"]
gpu = ["rlx-runtime/gpu", "rlx-mimi/gpu"]
# CoreML / Apple Neural Engine (LM graph only; Mimi stays CPU/Metal).
coreml = ["rlx-runtime/coreml"]

all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu", "vulkan"]
# Live microphone input + speaker playback for `moshi_voice_chat`.
mic = ["dep:cpal"]

[[bin]]
name = "rlx-moshi"
path = "src/bin/rlx_moshi.rs"
required-features = ["cli"]

[[example]]
name = "bench_one_way"
path = "examples/bench_one_way.rs"

[[example]]
name = "moshi_voice_chat"
path = "examples/moshi_voice_chat.rs"

# Uses optional axum/futures-util; only builds with the `ws-server` feature.
[[example]]
name = "ws_server"
required-features = ["ws-server"]

[dev-dependencies]
rlx-moshi = { path = ".", features = ["cli", "hf-download", "tokio", "metal"] }
rlx-mimi = { workspace = true, features = ["hf-download"] }
rlx-whisper = { workspace = true, features = ["tokenizer"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "config_load"
path = "tests/config_load.rs"

[[test]]
name = "weight_keys"
path = "tests/weight_keys.rs"

[[test]]
name = "stream_whisper_roundtrip"
path = "tests/stream_whisper_roundtrip.rs"

[[test]]
name = "gguf_keys"
path = "tests/gguf_keys.rs"

[[test]]
name = "mlx_keys"
path = "tests/mlx_keys.rs"

[[test]]
name = "gpu_smoke"
path = "tests/gpu_smoke.rs"

[[test]]
name = "rlx_temporal_parity"
path = "tests/rlx_temporal_parity.rs"

[[test]]
name = "rlx_depformer_parity"
path = "tests/rlx_depformer_parity.rs"

[[test]]
name = "rlx_gen_parity"
path = "tests/rlx_gen_parity.rs"

[[test]]
name = "rlx_mlx_native_load"
path = "tests/rlx_mlx_native_load.rs"

[lints]
workspace = true

[[test]]
name = "rlx_backend_parity"
path = "tests/rlx_backend_parity.rs"

[[test]]
name = "rlx_metal_arena"
path = "tests/rlx_metal_arena.rs"

[[test]]
name = "rlx_coreml_probe"
path = "tests/rlx_coreml_probe.rs"
