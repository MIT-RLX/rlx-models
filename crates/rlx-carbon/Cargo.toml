[package]
name = "rlx-carbon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Carbon (HuggingFaceBio) — Llama-shaped autoregressive DNA models with a hybrid Qwen3-BPE + DNA 6-mer tokenizer for RLX"
keywords.workspace = true
categories.workspace = true
readme = "README.md"
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
rlx-cli = { workspace = true }
rlx-llama32 = { workspace = true }
rlx-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true, optional = true }

[features]
default = []
# Text/DNA in, text/DNA out: the native HybridDNATokenizer (Qwen3 byte-level
# BPE for text + algorithmic DNA 6-mer coding). Without it the CLI/runner are
# token-ids only (the backbone still runs via rlx-llama32).
tokenizer = ["dep:tokenizers", "rlx-llama32/tokenizer"]
# Backend passthroughs to the rlx-llama32 backbone.
metal = ["rlx-llama32/metal"]
mlx = ["rlx-llama32/mlx"]
cuda = ["rlx-llama32/cuda"]
rocm = ["rlx-llama32/rocm"]
gpu = ["rlx-llama32/gpu"]
vulkan = ["rlx-llama32/vulkan"]
coreml = ["rlx-llama32/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[[bin]]
name = "rlx-carbon"
path = "src/bin/rlx_carbon.rs"

# DNA generation on any rlx backend (pass `--device`, build with the backend
# feature). See the file header for per-backend invocations.
[[example]]
name = "dna_generate"
required-features = ["tokenizer"]

[lints]
workspace = true
