# Carbon's hybrid tokenizer as an RLX program (WebAssembly): text through
# the package's Qwen3 BPE, nucleotides through the 6-mer table, around the
# package's `generate` entry. Built by `rlx-carbon`'s exporter, so it stands
# outside the workspace.
[package]
name = "rlx-carbon-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
