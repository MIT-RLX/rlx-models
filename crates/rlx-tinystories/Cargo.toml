[package]
name = "rlx-tinystories"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Train a small nanoGPT-style LLM from scratch on TinyStories — a showcase of the RLX rlx! DSL + autodiff training flow (unpublished)"
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish = false

[dependencies]
anyhow = { workspace = true }
# The training stack: `dsl` = the `rlx! { … }` graph DSL, `optim` = autodiff +
# CPU eval + the rlx_optim optimizers (AdamW, LR schedules, Func::train_step*).
# Path dep on the sibling rlx checkout, mirroring rlx-termclean.
rlx-tensor = { path = "../../../rlx/crates/core/rlx-tensor", version = "0.2.14", default-features = false, features = ["dsl", "optim"] }
# TinyStories fetch (synchronous ureq client) — pulled by the `download` feature.
hf-hub = { workspace = true, optional = true }
# mmap the byte-level corpus so a multi-GB train split never lives in RAM.
memmap2 = "0.9"

[dev-dependencies]
# Op-scope: per-op FLOPs/bytes/roofline cost model for the `inspect_ops` example.
rlx-opscope = { path = "../../../rlx/crates/tooling/rlx-opscope", version = "0.2.14" }

[features]
# Metal on by default (Apple GPU training); drop with --no-default-features for
# a pure-CPU build, and add `download` to auto-fetch TinyStories from the Hub.
default = ["metal", "download"]
metal = ["rlx-tensor/eval-metal"]
cuda = ["rlx-tensor/eval-cuda"]
download = ["dep:hf-hub"]

[[bin]]
name = "rlx-tinystories-train"
path = "src/bin/train.rs"

[[bin]]
name = "rlx-tinystories-generate"
path = "src/bin/generate.rs"

[lints]
workspace = true
