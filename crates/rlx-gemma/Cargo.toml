[package]
name = "rlx-gemma"
version = "0.2.13"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Gemma / Gemma 2 causal LMs for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-qwen3 = { workspace = true }
rlx-qwen35 = { workspace = true, features = ["tokenizer"] }
rlx-ir = { workspace = true }
rlx-flow = { workspace = true }
rlx-runtime = { workspace = true }
rlx-cpu = { workspace = true }
rlx-opt = { workspace = true }
rlx-gguf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
safetensors = { workspace = true }
half = { workspace = true }
anyhow = { workspace = true }
tokenizers = { workspace = true, optional = true }
# Multimodal preprocessing for Gemma 4 unified — JPEG/PNG decoder.
# The WAV parser lives inline in `multimodal.rs`, no extra dep.
image = { workspace = true }

[features]
default = []
tokenizer = ["dep:tokenizers"]
# Pulls in rlx-qwen35's llama-cpp-2-backed reference logits so the M2
# parity harness in `tests/gguf_parity.rs` can compare rlx-gemma vs
# llama.cpp on a fixture GGUF. No code duplication — rlx-gemma
# re-exports `rlx_qwen35::llama_reference` under this gate.
parity-llama = ["rlx-qwen35/parity-llama"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
coreml = ["rlx-runtime/coreml", "rlx-core/coreml", "rlx-cli/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[[bin]]
name = "rlx-gemma"
path = "src/bin/rlx_gemma.rs"

# Uses the real Gemma tokenizer; only builds with the optional `tokenizer` feature.
[[example]]
name = "bench_q4_decode"
required-features = ["tokenizer"]

# Uses `rlx_gemma::llama_reference`, only re-exported under `parity-llama`.
[[example]]
name = "gemma_llama_parity"
required-features = ["parity-llama"]

[lints]
workspace = true
