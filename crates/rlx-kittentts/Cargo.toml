[package]
name = "rlx-kittentts"
version = "0.2.14"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "KittenTTS native RLX text-to-speech"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-cli = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hound = "3"
once_cell = "1"
regex = "1"
fancy-regex = { version = "0.14", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
rlx = { workspace = true, optional = true, default-features = false }
rlx-ir = { workspace = true, optional = true }
kitten_tts_mini_rlx = { workspace = true, optional = true }

espeak-ng = { version = "0.1.2", optional = true, default-features = false, features = [
    "bundled-data-en",
] }

[dependencies.hf-hub]
workspace = true
optional = true

[features]
default = ["native", "rlx"]
native = ["dep:kitten_tts_mini_rlx", "dep:rlx-ir", "kitten_tts_mini_rlx/cpu", "kitten_tts_mini_rlx/native"]
native-fast = ["native", "kitten_tts_mini_rlx/native-fast", "metal"]
rlx = ["dep:rlx", "rlx/cpu"]
metal = [
    "rlx-runtime/metal",
    "rlx?/metal",
    "kitten_tts_mini_rlx?/metal",
]
mlx = ["rlx-runtime/mlx", "rlx?/mlx", "kitten_tts_mini_rlx?/mlx"]
cuda = [
    "rlx-runtime/cuda",
    "rlx?/cuda",
    "kitten_tts_mini_rlx?/cuda",
]
rocm = ["rlx-runtime/rocm", "rlx?/rocm"]
gpu = [
    "rlx-runtime/gpu",
    "rlx?/gpu",
    "kitten_tts_mini_rlx?/gpu",
]
vulkan = ["rlx-runtime/vulkan"]
coreml = ["rlx-runtime/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
full = ["native", "rlx", "all-backends"]
hf-download = ["dep:hf-hub"]
espeak = ["dep:espeak-ng", "dep:fancy-regex"]

[dev-dependencies]
rlx-whisper = { workspace = true }

[[bin]]
name = "rlx-kittentts"
path = "src/bin/rlx_kittentts.rs"
required-features = ["native"]

[[example]]
name = "native_alloc_bench"
path = "examples/native_alloc_bench.rs"
required-features = ["native-fast"]

[lints]
workspace = true
