# Soprano's host logic as an RLX program (WebAssembly): the prompt, the
# sampler, the chunking and the glue between the package's backbone and
# decoder. Built by `rlx-soprano`'s exporter, so it stands outside the
# workspace.
[package]
name = "rlx-soprano-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
serde_json = "1"

[workspace]
