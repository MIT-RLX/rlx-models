[package]
name = "rlx-soprano"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Soprano 1.1 (80M Qwen3 AR TTS + 32 kHz vocoder, Apache-2.0) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-assets = { workspace = true, features = ["rlxp", "native-pack"] }
rlx-tiny-tts = { path = "../rlx-tiny-tts", version = "0.2.19", default-features = false }
rlx-ir = { workspace = true }
rlx-onnx-import = { workspace = true, features = ["runtime"] }
rlx-gguf = { workspace = true }
rlx-qwen3 = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokenizers = { workspace = true }
hound = "3"

[dev-dependencies]
rlx-whisper = { workspace = true }
hound = "3"
tempfile = "3"
rlx-text = { workspace = true }
# The package's program (`tests/export_rlxp.rs`).
rlx-runtime = { workspace = true, features = ["program"] }

[[bin]]
name = "rlx-soprano"
path = "src/bin/rlx_soprano.rs"

[features]
default = []
# `export::export_rlxp`: Soprano as an `.rlxp` package rlx runs alone (its
# ONNX converted to rlx IR once, its host logic a program).
export = ["rlx-core/export"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda", "rlx-qwen3/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
coreml = ["rlx-runtime/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
macos-gpu = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]

[lints]
workspace = true
