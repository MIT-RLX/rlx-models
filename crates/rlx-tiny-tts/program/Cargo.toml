# TinyTTS / MeloTTS's host logic as an RLX program (WebAssembly,
# wasm32-wasip1): the English frontend (rlx-inflect-nano's) and the VITS glue
# around the package's graphs. Built by `rlx-tiny-tts`'s exporter, so it
# stands outside the workspace.
[package]
name = "rlx-tiny-tts-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
regex = "1"

[workspace]
