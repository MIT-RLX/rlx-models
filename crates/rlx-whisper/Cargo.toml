[package]
name = "rlx-whisper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "OpenAI Whisper ASR for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-ir = { workspace = true }
rlx-search = { workspace = true }
rlx-flow = { workspace = true }
rlx-runtime = { workspace = true }
rlx-opt = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
safetensors = { workspace = true }
rayon = "1.10"
rustfft = "6"
tokenizers = { workspace = true, optional = true }
rlx-vad = { workspace = true, optional = true }
rlx-wav2vec2-asr = { workspace = true, optional = true }
rlx-diarize = { workspace = true, optional = true }

[[bin]]
name = "rlx-whisper"
path = "src/bin/rlx_whisper.rs"

[dev-dependencies]
# The export test opens the package as any rlx program does.
rlx-text = { workspace = true }
tempfile = "3"

[features]
default = ["tokenizer", "timestamps"]
tokenizer = ["dep:tokenizers"]
timestamps = []
# `export::export_rlxp`: a checkpoint as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export"]
word-dtw = ["timestamps"]
word-w2v = ["timestamps", "dep:rlx-wav2vec2-asr"]
silero-vad = ["dep:rlx-vad", "rlx-vad/silero"]
diarize = ["dep:rlx-diarize", "rlx-diarize/wespeaker"]
metal = ["rlx-runtime/metal", "rlx-diarize?/metal"]
mlx = ["rlx-runtime/mlx", "rlx-diarize?/mlx"]
coreml = ["rlx-runtime/coreml", "rlx-diarize?/coreml"]
cuda = ["rlx-runtime/cuda", "rlx-diarize?/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu", "rlx-diarize?/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
macos-gpu = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[lints]
workspace = true
