[package]
name = "rlx-whisper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "OpenAI Whisper ASR for RLX"
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-ir = { workspace = true }
rlx-flow = { workspace = true }
rlx-runtime = { workspace = true }
rlx-opt = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
safetensors = { workspace = true }
rayon = "1.10"
rustfft = "6"
tokenizers = { workspace = true, optional = true }
rlx-vad = { workspace = true, optional = true }
rlx-wav2vec2-asr = { workspace = true, optional = true }
rlx-diarize = { workspace = true, optional = true }

[[bin]]
name = "rlx-whisper"
path = "src/bin/rlx_whisper.rs"

[features]
default = ["tokenizer", "timestamps"]
tokenizer = ["dep:tokenizers"]
timestamps = []
word-dtw = ["timestamps"]
word-w2v = ["timestamps", "dep:rlx-wav2vec2-asr"]
silero-vad = ["dep:rlx-vad", "rlx-vad/silero"]
diarize = ["dep:rlx-diarize"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
coreml = ["rlx-runtime/coreml"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[lints]
workspace = true
