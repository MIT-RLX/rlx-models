[package]
name = "rlx-models-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared config, weight loading, and compile helpers for RLX model crates"
keywords.workspace = true
categories.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[dependencies]
rlx-ir = { workspace = true }
rlx-flow = { workspace = true }
rlx-runtime = { workspace = true }
# For `pretrain::train_batches`: a multi-batch loop needs the backward pass. The
# optimizer stays the CALLER's (passed as a closure) — this crate resolves
# `rlx-optim` from the registry while the model crates patch it to a path, so a
# shared `dyn Optimizer` would be two different traits.
rlx-autodiff = { workspace = true }
# Model-agnostic multi-node pipeline API (graph partition + ParamSource seam).
rlx-distributed = { workspace = true }
rlx-cpu = { workspace = true }
rlx-opt = { workspace = true }
rlx-gguf = { workspace = true }
rlx-mlx-io = { workspace = true }
# Versatile bundle loading lives in the lean rlx-assets crate; re-exported here
# as `rlx_core::asset_source` / `rlx_core::{AssetSource,…}` for back-compat.
# `rlxp` enables official `.rlxp` packs (TinyTTS / MeloTTS / other asset bundles).
rlx-assets = { workspace = true, features = ["rlxp"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Hugging Face model card front matter (`package_export::split_huggingface_card`).
serde_yaml = "0.9"
safetensors = { workspace = true }
half = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true }
image = { workspace = true }
memmap2 = "0.9"
unicode-normalization = "0.1"
rayon = "1.10"
libc = "0.2"
rlx-metal = { workspace = true, optional = true }
rlx-mlx = { workspace = true, optional = true }
rlx-wgpu = { workspace = true, optional = true }
rlx-cuda = { workspace = true, optional = true }
rlx-rocm = { workspace = true, optional = true }


# The workspace pin carries no regex backend (see the root Cargo.toml).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { workspace = true, optional = true, features = ["onig"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { workspace = true, optional = true, features = ["unstable_wasm"] }

[features]
# Opt-in execution backends, used by the audio_ops_ir cross-backend tests and
# available to downstream crates that want core's helpers on a GPU. Off by
# default — default builds of this universal crate stay CPU-only.
metal = ["rlx-runtime/metal", "dep:rlx-metal"]
mlx = ["rlx-runtime/mlx", "dep:rlx-mlx"]
gpu = ["rlx-runtime/gpu", "dep:rlx-wgpu"]
cuda = ["rlx-runtime/cuda", "dep:rlx-cuda"]
rocm = ["rlx-runtime/rocm", "dep:rlx-rocm"]
vulkan = ["rlx-runtime/vulkan", "dep:rlx-wgpu"]
coreml = ["rlx-runtime/coreml"]
# Google TPU via libtpu/PJRT. Pure forwarding, like `coreml`: the backend
# lives in rlx-runtime, this only makes it reachable.
tpu = ["rlx-runtime/tpu"]
# Text in / text out for the DeepSeek-V4.1 runner. Without it the runner still
# generates, but on token ids and with a caller-supplied vocabulary.
tokenizer = ["dep:tokenizers"]
# `export`: the one `.rlxp` exporter every family's export goes through
# (`export::{Package, Checkpoint, decoder, graph}`, the exporter registry).
export = ["rlx-runtime/model-io"]

[dev-dependencies]
tokenizers = { workspace = true, features = ["onig"] }
tempfile = "3"
rlx-opscope = { workspace = true }

[lints]
workspace = true
