[package]
name = "rlx-moonshine-streaming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Moonshine v2 streaming ASR (tiny / small / medium) on RLX — sliding-window encoder, Moonshine decoder"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-moonshine = { workspace = true }
rlx-runtime = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true, optional = true }

[[bin]]
name = "rlx-moonshine-streaming"
path = "src/bin/rlx_moonshine_streaming.rs"
required-features = ["tokenizer"]

[features]
default = ["tokenizer"]
# Text out (`transcribe`); without it only token ids are available.
tokenizer = ["dep:tokenizers"]
# `export::export_rlxp`: a checkpoint as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export"]
metal = ["rlx-moonshine/metal"]
mlx = ["rlx-moonshine/mlx"]
cuda = ["rlx-moonshine/cuda"]
rocm = ["rlx-moonshine/rocm"]
gpu = ["rlx-moonshine/gpu"]
webgl = ["rlx-runtime/opengl"]
vulkan = ["rlx-moonshine/vulkan"]
coreml = ["rlx-moonshine/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
macos-gpu = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]

[dev-dependencies]
rlx-text = { workspace = true }
tempfile = "3"

[lints]
workspace = true
