[package]
name = "rlx-models"
version = "0.2.11"
edition.workspace = true
rust-version.workspace = true
description = "Model loading for RLX — config parsing, safetensors weights, graph builders"
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
# ── Model families (opt-in) ─────────────────────────────────────────────────
# Every model family below is an OPTIONAL dependency, surfaced through a
# matching feature (see [features]). The default build pulls only the
# embedding/tokenizer stack; consumers opt into the catalogue they need so the
# heavy/native deps of unused families (e.g. candle via the kyutai/moshi codec)
# never reach a binary that doesn't ask for them.
rlx-sam-ir = { workspace = true, optional = true }
rlx-bert = { workspace = true, optional = true }
rlx-clinicalbert = { workspace = true, optional = true }
rlx-nomic = { workspace = true, optional = true }
rlx-vision = { workspace = true, optional = true }
rlx-dinov2 = { workspace = true, optional = true }
rlx-bioclip2 = { workspace = true, optional = true }
rlx-embed = { workspace = true, optional = true }
rlx-sam = { workspace = true, optional = true }
rlx-sam2 = { workspace = true, optional = true }
rlx-sam3 = { workspace = true, optional = true }
rlx-qwen3 = { workspace = true, optional = true }
rlx-qwen3-tts = { workspace = true, optional = true }
rlx-llama32 = { workspace = true, optional = true }
rlx-gemma = { workspace = true, optional = true }
rlx-llada2 = { workspace = true, optional = true }
rlx-qwen35 = { workspace = true, optional = true }
rlx-qwen25-vl = { workspace = true, optional = true }
rlx-flux2 = { workspace = true, optional = true }
rlx-diamond = { workspace = true, optional = true }
rlx-vjepa2 = { workspace = true, optional = true }
rlx-wav2vec2-bert = { workspace = true, optional = true }
rlx-wav2vec2-asr = { workspace = true, optional = true }
rlx-diarize = { workspace = true, optional = true }
rlx-whisper = { workspace = true, optional = true, features = ["tokenizer", "timestamps"] }
rlx-vad = { workspace = true, optional = true }
rlx-aec = { workspace = true, optional = true }
rlx-voxtral = { workspace = true, optional = true }
rlx-qwen3-asr = { workspace = true, optional = true }
rlx-locateanything = { workspace = true, optional = true }
rlx-voxtral-tts = { workspace = true, optional = true }
rlx-ocr = { workspace = true, optional = true }
rlx-neutts = { workspace = true, optional = true }
rlx-orpheus = { workspace = true, optional = true }
rlx-kittentts = { workspace = true, optional = true }
rlx-florence2 = { workspace = true, optional = true }
rlx-mimi = { workspace = true, optional = true }
rlx-tsac = { workspace = true, optional = true }
rlx-moshi = { workspace = true, optional = true }
rlx-kyutai-tts = { workspace = true, optional = true }
rlx-mistral = { workspace = true, optional = true }
rlx-bonsai = { workspace = true, optional = true }
rlx-minicpm5 = { workspace = true, optional = true, features = ["tokenizer"] }
rlx-tinyllama = { workspace = true, optional = true, features = ["tokenizer"] }
rlx-phi = { workspace = true, optional = true }
rlx-omnicoder = { workspace = true, optional = true }
rlx-granite = { workspace = true, optional = true }
rlx-cohere = { workspace = true, optional = true }
rlx-llama-base = { workspace = true, optional = true }

rlx-ir = { workspace = true }
rlx-flow = { workspace = true }
rlx-runtime = { workspace = true }
rlx-opt = { workspace = true }
rlx-cpu = { workspace = true }
rlx-gguf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
safetensors = { workspace = true }
half = { workspace = true }
anyhow = { workspace = true }
hound = "3.5"
bytemuck = { workspace = true }
llama-cpp-2 = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
rlx-metal = { workspace = true, optional = true }
rlx-mlx = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
image = { workspace = true, optional = true }
rlx-lfm = { workspace = true, optional = true }

[dev-dependencies]
ndarray = "0.16"
criterion = { workspace = true }
rlx-ssm = { workspace = true }
rlx-opt = { workspace = true }
rlx-qwen3-vl = { workspace = true }
rlx-lfm-vl = { workspace = true }
rlx-nemotron-omni = { workspace = true }
rlx-vlm-base = { workspace = true }
rlx-whisper = { workspace = true, features = ["tokenizer", "timestamps", "word-dtw"] }
rlx-vad = { workspace = true }
image = { workspace = true }
tempfile = "3"
serde_json = { workspace = true }
rlx-qwen25-vl = { workspace = true, features = ["tokenizer", "qwen25-vl-vision"] }

[features]
# Default pulls only the embedding/tokenizer stack — NOT the full catalogue.
# Opt into model families via the per-family features below (or the `encoders`
# / `llm` / `asr` / `tts` / `vision-models` / `all-models` groups).
default = ["qwen35-tokenizer", "flux2-tokenizer", "flux2-image", "embed"]

# ── Per-family features (each enables one optional family crate) ─────────────
bert = ["dep:rlx-bert"]
clinicalbert = ["dep:rlx-clinicalbert"]
nomic = ["dep:rlx-nomic"]
vision = ["dep:rlx-vision"]
dinov2 = ["dep:rlx-dinov2"]
bioclip2 = ["dep:rlx-bioclip2"]
embed = ["dep:rlx-embed", "rlx-embed/embed"]
flux2 = ["dep:rlx-flux2"]
diamond = ["dep:rlx-diamond"]
qwen3 = ["dep:rlx-qwen3"]
qwen35 = ["dep:rlx-qwen35"]
llama32 = ["dep:rlx-llama32"]
llama-base = ["dep:rlx-llama-base"]
gemma = ["dep:rlx-gemma"]
llada2 = ["dep:rlx-llada2"]
mistral = ["dep:rlx-mistral"]
bonsai = ["dep:rlx-bonsai"]
minicpm5 = ["dep:rlx-minicpm5"]
tinyllama = ["dep:rlx-tinyllama"]
phi = ["dep:rlx-phi"]
omnicoder = ["dep:rlx-omnicoder"]
granite = ["dep:rlx-granite"]
cohere = ["dep:rlx-cohere"]
lfm = ["dep:rlx-lfm"]
sam = ["dep:rlx-sam", "sam-ir"]
sam2 = ["dep:rlx-sam2", "sam-ir"]
sam3 = ["dep:rlx-sam3", "sam-ir"]
sam-ir = ["dep:rlx-sam-ir"]
vjepa2 = ["dep:rlx-vjepa2"]
florence2 = ["dep:rlx-florence2"]
locateanything = ["dep:rlx-locateanything"]
diarize = ["dep:rlx-diarize"]
whisper = ["dep:rlx-whisper"]
vad = ["dep:rlx-vad"]
aec = ["dep:rlx-aec"]
voxtral = ["dep:rlx-voxtral"]
qwen3-asr = ["dep:rlx-qwen3-asr"]
wav2vec2-bert = ["dep:rlx-wav2vec2-bert"]
wav2vec2-asr = ["dep:rlx-wav2vec2-asr"]
ocr = ["dep:rlx-ocr"]
neutts = ["dep:rlx-neutts"]
orpheus = ["dep:rlx-orpheus"]
kittentts = ["dep:rlx-kittentts"]
qwen3-tts = ["dep:rlx-qwen3-tts"]
voxtral-tts = ["dep:rlx-voxtral-tts"]
# kyutai-tts pulls the moshi/mimi neural codec, which is the ONLY path to candle
# in this crate — keep it strictly opt-in.
mimi = ["dep:rlx-mimi"]
moshi = ["dep:rlx-moshi"]
tsac = ["dep:rlx-tsac"]
kyutai-tts = ["dep:rlx-kyutai-tts", "mimi", "moshi"]

# The generic model runner (`rlx_models::run`, `LmRunner`) hard-references a set
# of families; enabling it pulls exactly those.
runner = [
    "qwen3",
    "qwen35",
    "llama32",
    "gemma",
    "lfm",
    "dinov2",
    "vjepa2",
    "flux2",
    "sam",
    "sam2",
    "sam3",
    "wav2vec2-bert",
]

# ── Capability groups ───────────────────────────────────────────────────────
encoders = ["bert", "clinicalbert", "nomic", "vision", "embed", "dinov2", "bioclip2"]
llm = [
    "runner",
    "qwen3",
    "qwen35",
    "llama32",
    "gemma",
    "phi",
    "mistral",
    "granite",
    "cohere",
    "lfm",
    "llada2",
    "minicpm5",
    "tinyllama",
    "omnicoder",
    "bonsai",
    "llama-base",
]
asr = ["whisper", "wav2vec2-bert", "wav2vec2-asr", "voxtral", "qwen3-asr", "vad", "diarize", "aec"]
tts = ["kyutai-tts", "kittentts", "orpheus", "neutts", "qwen3-tts", "voxtral-tts", "tsac"]
vision-models = [
    "sam",
    "sam2",
    "sam3",
    "florence2",
    "vjepa2",
    "locateanything",
    "flux2",
    "diamond",
    "dinov2",
    "bioclip2",
]
all-models = ["encoders", "llm", "asr", "tts", "vision-models", "ocr", "runner"]

# Forward rlx-cli's `compat-net` so `rlx_models::run::check_hf_repo` works.
whisper-subtitles = [
    "whisper",
    "rlx-whisper/word-dtw",
    "rlx-whisper/silero-vad",
    "rlx-whisper/diarize",
]
# hf-download is cross-cutting: it only adds the `hf-download` capability to the
# families a consumer has already enabled (`?/` = don't force-enable the dep).
hf-download = [
    "dep:hf-hub",
    "rlx-embed?/hf-download",
    "rlx-llada2?/hf-download",
    "rlx-flux2?/hf-download",
    "rlx-minicpm5?/hf-download",
