[features]
# Default pulls only the embedding/tokenizer stack — NOT the full catalogue.
# Opt into model families via the per-family features below (or the `encoders`
# / `llm` / `asr` / `tts` / `vision-models` / `all-models` groups).
default = ["qwen35-tokenizer", "flux2-tokenizer", "flux2-image", "embed"]

# ── Per-family features (each enables one optional family crate) ─────────────
bert = ["dep:rlx-bert"]
clinicalbert = ["dep:rlx-clinicalbert"]
nomic = ["dep:rlx-nomic"]
vision = ["dep:rlx-vision"]
dinov2 = ["dep:rlx-dinov2"]
dinov3 = ["dep:rlx-dinov3"]
trellis2 = ["dep:rlx-trellis2"]
uni2 = ["dep:rlx-uni2"]
hoct = ["dep:rlx-hoct"]
bioclip2 = ["dep:rlx-bioclip2"]
embed = ["dep:rlx-embed", "rlx-embed/embed"]
flux2 = ["dep:rlx-flux2"]
diamond = ["dep:rlx-diamond"]
qwen3 = ["dep:rlx-qwen3"]
qwen35 = ["dep:rlx-qwen35"]
minimax = ["dep:rlx-minimax"]
fara = ["dep:rlx-fara", "qwen35"]
llama32 = ["dep:rlx-llama32"]
llama-base = ["dep:rlx-llama-base"]
gemma = ["dep:rlx-gemma"]
llada2 = ["dep:rlx-llada2"]
mistral = ["dep:rlx-mistral"]
mistral-vl = ["dep:rlx-mistral-vl", "mistral", "llama32"]
bonsai = ["dep:rlx-bonsai"]
neutrino = ["dep:rlx-neutrino"]
minicpm5 = ["dep:rlx-minicpm5"]
nanbeige = ["dep:rlx-nanbeige"]
tinyllama = ["dep:rlx-tinyllama"]
phi = ["dep:rlx-phi"]
omnicoder = ["dep:rlx-omnicoder"]
granite = ["dep:rlx-granite"]
inkling = ["dep:rlx-inkling"]
laguna = ["dep:rlx-laguna"]
laguna-serve = ["laguna", "rlx-laguna/serve"]
cohere = ["dep:rlx-cohere"]
lfm = ["dep:rlx-lfm"]
qwen3-vl = ["dep:rlx-qwen3-vl", "qwen3"]
lfm-vl = ["dep:rlx-lfm-vl", "lfm"]
# Llama-4 (MoE + native vision) and Llama-3.2-Vision (mllama, cross-attention).
# Both are safetensors-checkpoint runners (`from_checkpoint(dir, device)`), not
# `LmRunner`/GGUF — used via their own builders, not `auto_runner`.
llama4 = ["dep:rlx-llama4"]
mllama = ["dep:rlx-mllama"]
sam = ["dep:rlx-sam", "sam-ir"]
sam2 = ["dep:rlx-sam2", "sam-ir"]
sam3 = ["dep:rlx-sam3", "sam-ir"]
sam-ir = ["dep:rlx-sam-ir"]
vjepa2 = ["dep:rlx-vjepa2"]
florence2 = ["dep:rlx-florence2"]
locateanything = ["dep:rlx-locateanything"]
unlimited-ocr = ["dep:rlx-unlimited-ocr"]
diarize = ["dep:rlx-diarize"]
whisper = ["dep:rlx-whisper"]
vad = ["dep:rlx-vad"]
wake = ["dep:rlx-wake"]
wakeword = ["dep:rlx-wakeword", "dep:rlx-wakeword-core", "wake"]
openwakeword = ["dep:rlx-openwakeword", "wake"]
nanowakeword = ["dep:rlx-nanowakeword", "wake"]
porcupine = ["dep:rlx-porcupine", "wake"]
voxrt = ["dep:rlx-voxrt", "wake"]
aec = ["dep:rlx-aec"]
voxtral = ["dep:rlx-voxtral"]
qwen3-asr = ["dep:rlx-qwen3-asr"]
conformer-ctc = ["dep:rlx-conformer-ctc"]
funasr = ["dep:rlx-funasr"]
nemotron-asr = ["dep:rlx-nemotron-asr"]
wav2vec2-bert = ["dep:rlx-wav2vec2-bert"]
wav2vec2-asr = ["dep:rlx-wav2vec2-asr"]
ocr = ["dep:rlx-ocr"]
# RLX streaming Conformer ASR (`rlx-asr`).
streaming-asr = ["dep:rlx-asr"]
ppocrv6 = ["dep:rlx-ppocrv6"]
neutts = ["dep:rlx-neutts"]
orpheus = ["dep:rlx-orpheus"]
kittentts = ["dep:rlx-kittentts"]
# RLX FastSpeech2 + WaveRNN TTS (private local bundle).
rlx-tts = ["dep:rlx-tts"]
kokoro = ["dep:rlx-kokoro"]
# Native (ort-free) Kokoro path — graph-split encoder + decoder_raw on RLX backends.
kokoro-native = ["kokoro", "rlx-kokoro/native"]
supertonic = ["dep:rlx-supertonic"]
luxtts = ["dep:rlx-luxtts"]
zipvoice = ["dep:rlx-zipvoice"]
moss-nano = ["dep:rlx-moss-nano"]
maya1 = ["dep:rlx-maya1"]
miratts = ["dep:rlx-miratts"]
f5tts = ["dep:rlx-f5tts"]
piper = ["dep:rlx-piper"]
# Native (ort-free) piper over rlx-onnx-import + rlx-ir (enc_p + flow_dec split,
# stochastic duration predictor in Rust).
piper-native = ["piper", "rlx-piper/native"]
qwen3-tts = ["dep:rlx-qwen3-tts"]
voxtral-tts = ["dep:rlx-voxtral-tts"]
# kyutai-tts pulls the moshi/mimi neural codec, which is the ONLY path to candle
# in this crate — keep it strictly opt-in.
mimi = ["dep:rlx-mimi"]
moshi = ["dep:rlx-moshi"]
tsac = ["dep:rlx-tsac"]
kyutai-tts = ["dep:rlx-kyutai-tts", "mimi", "moshi"]
melotts    = ["dep:rlx-melotts"]
gepard     = ["dep:rlx-gepard"]
openvoice = ["dep:rlx-openvoice"]
parlertts = ["dep:rlx-parlertts"]
metavoice = ["dep:rlx-metavoice"]
chatterbox = ["dep:rlx-chatterbox"]

# The generic model runner (`rlx_models::run`, `LmRunner`) hard-references a set
# of families; enabling it pulls exactly those.
runner = [
    "qwen3",
    "qwen35",
    "qwen3-vl",
    "llama32",
    "gemma",
    "lfm",
    "lfm-vl",
    "mistral",
