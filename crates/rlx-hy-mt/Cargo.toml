[package]
name = "rlx-hy-mt"
version = "0.2.16"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tencent HY-MT1.5 on-device translation (Hunyuan dense; Qwen3-shaped)"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-qwen3 = { workspace = true }
rlx-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hf-hub = { workspace = true, optional = true }

[features]
default = []
hf-download = ["dep:hf-hub"]
metal = ["rlx-qwen3/metal"]
mlx = ["rlx-qwen3/mlx"]
cuda = ["rlx-qwen3/cuda"]
rocm = ["rlx-qwen3/rocm"]
gpu = ["rlx-qwen3/gpu"]
vulkan = ["rlx-qwen3/vulkan"]
coreml = ["rlx-qwen3/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]

[[bin]]
name = "rlx-hy-mt"
path = "src/bin/rlx_hy_mt.rs"
[lints]
workspace = true
