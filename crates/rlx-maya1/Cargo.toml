[package]
name = "rlx-maya1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Maya1 (Llama-3B + SNAC expressive voice-design TTS, Apache-2.0) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
hound = "3"
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
# Maya1 is Orpheus-family (Llama-3B + SNAC, byte-identical SNAC token layout):
# reuse the rlx-orpheus GGUF backbone + SNAC decoder + prompt builder wholesale.
rlx-orpheus = { workspace = true }

[features]
default = ["metal", "mlx", "coreml"]
metal = ["rlx-runtime/metal", "rlx-orpheus/metal"]
mlx = ["rlx-runtime/mlx", "rlx-orpheus/mlx"]
coreml = ["rlx-runtime/coreml", "rlx-orpheus/coreml"]
cuda = ["rlx-runtime/cuda", "rlx-orpheus/cuda"]
gpu = ["rlx-runtime/gpu", "rlx-orpheus/gpu"]
vulkan = ["rlx-runtime/vulkan", "rlx-orpheus/vulkan"]
all-backends = ["metal", "mlx", "coreml", "cuda", "gpu", "vulkan"]
hf-download = ["rlx-orpheus/hf-download"]
# `export::export_rlxp`: Maya1 as an `.rlxp` package rlx runs alone.
export = ["rlx-orpheus/export"]

[dev-dependencies]
rlx-ir = { workspace = true }
rlx-whisper = { workspace = true }
serde_json = { workspace = true }
rlx-text = { workspace = true }
tempfile = "3"
# The package's program (`tests/export_rlxp.rs`).
rlx-runtime = { workspace = true, features = ["program"] }

[[bin]]
name = "rlx-maya1"
path = "src/bin/rlx_maya1.rs"

[lints]
workspace = true
