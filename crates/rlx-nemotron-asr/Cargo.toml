[package]
name = "rlx-nemotron-asr"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description = "NVIDIA Nemotron 3.5 ASR Streaming (cache-aware FastConformer + RNN-T) runner for RLX, loaded natively from .nemo"

[dependencies]
anyhow       = { workspace = true }
rlx-core     = { workspace = true }
rlx-cli      = { workspace = true }
rlx-flow     = { workspace = true }
rlx-ir       = { workspace = true }
rlx-runtime  = { workspace = true }
rlx-opt      = { workspace = true }
rlx-nemo     = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
rustfft      = "6"
tokenizers   = { workspace = true, optional = true }

[features]
default = ["tokenizer"]
tokenizer = ["dep:tokenizers"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
coreml = ["rlx-runtime/coreml"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[lints]
workspace = true
