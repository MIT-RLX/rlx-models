# Nemotron ASR's host logic as an RLX program (WebAssembly): the greedy
# RNN-T search over the package's encoder, prediction net and joint, and
# the SentencePiece pieces. Built by `rlx-nemotron-asr`'s exporter, so it
# stands outside the workspace.
[package]
name = "rlx-nemotron-asr-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
serde_json = "1"

[workspace]
