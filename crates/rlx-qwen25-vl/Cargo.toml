[package]
name = "rlx-qwen25-vl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Qwen2.5-VL vision-language model for RLX (AIF / VLMEvalKit target)"
repository.workspace = true

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-qwen3 = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
rlx-gguf = { workspace = true }
rlx-vlm-base = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true, optional = true }
image = { workspace = true, optional = true }

[features]
default = ["tokenizer", "qwen25-vl-vision"]
tokenizer = ["dep:tokenizers"]
qwen25-vl-vision = ["dep:image"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[[bin]]
name = "rlx-qwen25-vl"
path = "src/bin/rlx_qwen25_vl.rs"

[[example]]
name = "aif_eval"
path = "examples/aif_eval.rs"
required-features = ["tokenizer", "qwen25-vl-vision"]

[[example]]
name = "vlmevalkit_eval"
path = "examples/vlmevalkit_eval.rs"
required-features = ["tokenizer", "qwen25-vl-vision"]

[dev-dependencies]
rlx-core = { workspace = true }

[lints]
workspace = true
