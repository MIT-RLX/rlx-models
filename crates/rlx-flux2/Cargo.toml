[package]
name = "rlx-flux2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "FLUX.2 rectified-flow image model for RLX"
repository.workspace = true

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-diamond = { workspace = true }
rlx-gguf = { workspace = true }
rlx-qwen3 = { workspace = true }
rlx-tensor = { workspace = true }
rlx-ir = { workspace = true }
rlx-flow = { workspace = true }
rlx-runtime = { workspace = true }
rlx-opt = { workspace = true }
rlx-cpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
safetensors = { workspace = true }
anyhow = { workspace = true }
half = { workspace = true }
bytemuck = { workspace = true }
tokenizers = { workspace = true, optional = true }
image = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }

[features]
default = ["flux2-tokenizer", "flux2-image"]
flux2-tokenizer = ["dep:tokenizers"]
flux2-image = ["dep:image"]
hf-download = ["dep:hf-hub"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[[bin]]
name = "rlx-flux2"
path = "src/bin/rlx_flux2.rs"

[[bin]]
name = "rlx-flux2-serve"
path = "src/bin/rlx_flux2_serve.rs"

[lints]
workspace = true
