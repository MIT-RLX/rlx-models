[package]
name = "rlx-minimax"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MiniMax runners for RLX — M2.5/M2.7 Lightning Attention LM, and M3 (MSA block-sparse MoE + vision tower)"
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = { workspace = true }
rlx-core = { workspace = true }
rlx-llama-base = { workspace = true }
rlx-cli = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
rlx-ssm = { workspace = true }
rlx-cpu = { workspace = true }
rlx-gguf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The export test opens the package as any rlx program does.
rlx-text = { workspace = true }
tempfile = "3"

[features]
default = []
# `m3::export::export_rlxp`: a checkpoint as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
macos-gpu = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[lints]
workspace = true
