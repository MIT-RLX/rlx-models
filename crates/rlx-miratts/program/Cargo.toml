# MiraTTS's host logic as an RLX program (WebAssembly): the prompt, the
# LM's sampling loop and the glue to BiCodec's graphs. Built by
# `rlx-miratts`'s exporter, so it stands outside the workspace.
[package]
name = "rlx-miratts-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
serde_json = "1"

[workspace]
