[package]
name = "rlx-lfm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "LiquidAI LFM2 / LFM2.5 runner (text) — hybrid ShortConv + GQA-attention GGUF LM (+ legacy SSM decode)"
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = { workspace = true }
rlx-core = { workspace = true }
rlx-llama-base = { workspace = true }
rlx-cli = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
rlx-ssm = { workspace = true }
rlx-cpu = { workspace = true }
rlx-gguf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Text prompts + detokenize via the GGUF-embedded gpt2 BPE (LFM2 uses it).
rlx-qwen35 = { workspace = true, optional = true }

[dev-dependencies]
tokenizers = { workspace = true }

[[bin]]
name = "rlx-lfm"
path = "src/bin/rlx_lfm.rs"

# LFM2/LFM2.5 GGUF text generation on any backend (pass `--device`).
[[example]]
name = "lfm2_generate"
required-features = ["tokenizer"]

# TTFT / steady-state decode bench — prompts go through the GGUF gpt2 BPE.
[[example]]
name = "lfm2_bench"
required-features = ["tokenizer"]

[features]
default = []
# Text in / text out for the GGUF runner (reuses the GGUF gpt2 BPE reader).
tokenizer = ["dep:rlx-qwen35", "rlx-qwen35/tokenizer"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[lints]
workspace = true
