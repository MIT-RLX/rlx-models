[package]
name = "rlx-dinov3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "DINOv3 ViT (2D-axial RoPE, register tokens, LayerScale, optional gated MLP) encoder for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
rlx-opt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
image = { workspace = true }

[dev-dependencies]
tempfile = "3"
safetensors = { workspace = true }
rlx-cli = { workspace = true }
rlx-runtime = { workspace = true }

[[bin]]
name = "rlx-dinov3"
path = "src/bin/rlx_dinov3.rs"

[lints]
workspace = true

[features]
# `export::export_rlxp`: a checkpoint as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export"]
default = []
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
macos-gpu = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]
