[package]
name = "rlx-voxtral-tts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Mistral Voxtral-4B-TTS for RLX — codec decoder + acoustic head (vLLM-Omni port)"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
rlx-llama32 = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
safetensors = { workspace = true }
half = { workspace = true }
hound = "3.5"
kitoken = "0.11"
ndarray = "0.16"
memmap2 = "0.9"
bytemuck = { workspace = true }
rand = "0.8"
rand_distr = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }

[[bin]]
name = "rlx-voxtral-tts"
path = "src/bin/rlx_voxtral_tts.rs"

[features]
default = []
compiled = []
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
macos-gpu = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]
# `export::export_rlxp`: Voxtral-4B-TTS as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export"]

[dev-dependencies]
tempfile = "3"
# The package's program (`tests/export_rlxp.rs`).
rlx-runtime = { workspace = true, features = ["program"] }

[lints]
workspace = true
