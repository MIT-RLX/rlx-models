# Voxtral-4B-TTS's host logic as an RLX program (WebAssembly, wasm32-wasip1):
# the Tekken tokenizer, the speech prompt with a voice's rows, each frame's
# noise (the crate's `rng.rs`), the semantic pick, the acoustic codes, the end
# of audio, and the codec. Built by `rlx-voxtral-tts`'s exporter, so it
# stands outside the workspace.
[package]
name = "rlx-voxtral-tts-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
serde_json = "1"
# Tekken (`src/tekken.rs`): tiktoken-style byte-pair ranks.
base64 = "0.22"
regex = { package = "fancy-regex", version = "0.14" }
# The runner's noise stream (`src/rng.rs`).
rand = "0.8"
rand_distr = "0.4"

[workspace]
