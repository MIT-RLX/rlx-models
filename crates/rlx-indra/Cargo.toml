[package]
name = "rlx-indra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Indra OCR (datalab-to/indra) — native RLX graphs + Rust page pipeline (no runtime ONNX)"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-core = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
anyhow = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
safetensors = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
unicode-normalization = "0.1"
unicode-bidi = "0.3"
unicode-width = "0.2"
unicode-general-category = "1"
# `rlx-indra-convert`: ONNX initializers + lm*.npz → safetensors (export only).
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
# Parity tests only: ONNX Runtime runs the upstream graphs as the reference.
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = [
    "std",
    "download-binaries",
    "tls-rustls",
] }

[features]
default = ["convert"]
convert = ["dep:zip"]
parity-ort = ["dep:ort"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
blas-accelerate = ["rlx-runtime/blas-accelerate"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
macos-gpu = ["metal", "mlx", "gpu"]

[[bin]]
name = "rlx-indra"
path = "src/bin/rlx_indra.rs"

[[bin]]
name = "rlx-indra-convert"
path = "src/bin/rlx_indra_convert.rs"
required-features = ["convert"]

[[test]]
name = "indra_bench"
path = "tests/indra_bench.rs"
required-features = ["parity-ort"]

[[test]]
name = "indra_parity_ort"
path = "tests/indra_parity_ort.rs"
required-features = ["parity-ort"]

[lints]
workspace = true
