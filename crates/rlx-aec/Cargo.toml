[package]
name = "rlx-aec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Acoustic echo cancellation (FDAF-NLMS + RLX residual suppression) at 16 kHz"
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true, optional = true }
rlx-fft = { workspace = true }
rlx-ir = { workspace = true, optional = true }
rlx-flow = { workspace = true, optional = true }
rlx-runtime = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
safetensors = { workspace = true }
[[bin]]
name = "rlx-aec"
path = "src/bin/rlx_aec.rs"

[[example]]
name = "echo_bench"
path = "examples/echo_bench.rs"

[[test]]
name = "synthetic_echo"
path = "tests/synthetic_echo.rs"

[[test]]
name = "fdaf_parity"
path = "tests/fdaf_parity.rs"

[[test]]
name = "whisper_e2e"
path = "tests/whisper_e2e.rs"

[features]
default = ["residual"]
residual = []
rlx-compile = ["dep:rlx-core", "dep:rlx-ir", "dep:rlx-flow"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[dev-dependencies]
fdaf-aec = "0.1.0"
rlx-whisper = { workspace = true, features = ["tokenizer"] }

[lints]
workspace = true
