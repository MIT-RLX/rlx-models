[package]
name = "rlx-wav2vec2-asr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Wav2Vec2 CTC forced alignment for WhisperX-style word timestamps"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
fancy-regex = "0.14"
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
rlx-torch-ckpt = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[features]
metal = ["rlx-runtime/metal"]
gpu = ["rlx-runtime/gpu"]
cuda = ["rlx-runtime/cuda"]

[lints]
workspace = true

[dev-dependencies]
rlx-runtime = { workspace = true }
# float_roundtrip: parity reads reference floats bit for bit.
serde_json = { workspace = true, features = ["float_roundtrip"] }
