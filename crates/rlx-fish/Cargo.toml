[package]
name = "rlx-fish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Fish Audio S2-Pro (dual-AR) and Drama 3 TTS + voice cloning, with the fish 44.1 kHz codec, on RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
half = { workspace = true }
hound = "3"
memmap2 = "0.9"
rayon = "1.10"
safetensors = { workspace = true }
clap = { version = "4", features = ["derive"] }

rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
rlx-flow = { workspace = true }
rlx-core = { workspace = true }
rlx-cli = { workspace = true }
rlx-torch-ckpt = { workspace = true }

[dependencies.tokenizers]
workspace = true
optional = true

[features]
default = ["tokenizer"]
# Qwen BPE tokenizer for the text front end. Without it the crate
# synthesizes from caller-supplied token ids.
tokenizer = ["dep:tokenizers"]

metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
macos-gpu = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
# `export::export_rlxp`: Fish S2-Pro as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export"]

[dev-dependencies]
tempfile = "3"
rlx-text = { workspace = true }
# The package's program (`tests/export_rlxp.rs`).
rlx-runtime = { workspace = true, features = ["program"] }

[[bin]]
name = "rlx-fish"
path = "src/bin/rlx_fish.rs"
required-features = ["tokenizer"]

[lints]
workspace = true
