# Fish Audio S2-Pro's host logic as an RLX program (WebAssembly): the
# conversation (the crate's `prompt.rs`), the dual-AR loop with the crate's
# sampler (`sampling.rs`), and the codec. Built by `rlx-fish`'s exporter, so
# it stands outside the workspace.
[package]
name = "rlx-fish-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
serde_json = "1"
anyhow = "1"

# `prompt.rs`'s own tokenizer impls (the host tokenizes here).
[features]
tokenizer = []

[workspace]
