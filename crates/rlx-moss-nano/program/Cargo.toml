# MOSS-TTS-Nano's host logic as an RLX program (WebAssembly, wasm32-wasip1):
# the prompt rows, the frame loop and its random draws, the pause trimming
# around the package's graphs. Built by `rlx-moss-nano`'s exporter, so it
# stands outside the workspace.
[package]
name = "rlx-moss-nano-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
