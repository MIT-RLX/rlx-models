[package]
name = "rlx-moss-nano"
version = "0.2.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "MOSS-TTS-Nano (OpenMOSS hierarchical AR codec-LM TTS, 48 kHz, Apache-2.0) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
hound = "3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Pure-Rust tokenizer (loads a converted BPE tokenizer.json). NOTE: must NOT use
# the C++ `sentencepiece` crate here — it statically links its own protobuf,
# which clashes (ODR) with ONNX Runtime's bundled protobuf and corrupts ORT's
# model parsing ("Protobuf parsing failed").
tokenizers = { workspace = true }
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
# ONNX Runtime execution-provider selector reused from rlx-kittentts.
rlx-kittentts = { path = "../rlx-kittentts", default-features = false }

[dependencies.hf-hub]
workspace = true
optional = true

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = [
    "std",
    "pkg-config",
    "download-binaries",
    "tls-rustls",
] }

[features]
default = ["onnx"]
onnx = ["dep:ort", "rlx-kittentts/onnx"]
metal = ["rlx-runtime/metal", "rlx-kittentts/metal", "rlx-kittentts/ort-coreml"]
mlx = ["rlx-runtime/mlx", "rlx-kittentts/mlx", "rlx-kittentts/ort-coreml"]
cuda = ["rlx-runtime/cuda", "rlx-kittentts/cuda", "rlx-kittentts/ort-cuda"]
gpu = ["rlx-runtime/gpu", "rlx-kittentts/gpu"]
all-backends = ["metal", "mlx", "cuda", "gpu"]
apple-silicon = ["metal", "mlx", "gpu"]
hf-download = ["dep:hf-hub"]

[dev-dependencies]
rlx-whisper = { workspace = true }

[[bin]]
name = "rlx-moss-nano"
path = "src/bin/rlx_moss_nano.rs"
required-features = ["onnx"]

[lints]
workspace = true
