[package]
name = "rlx-moss-nano"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "MOSS-TTS-Nano (OpenMOSS hierarchical AR codec-LM TTS, 48 kHz, Apache-2.0) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-ir = { workspace = true }
anyhow = { workspace = true }
hound = "3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Pure-Rust tokenizer (loads a converted BPE tokenizer.json). NOTE: must NOT use
# the C++ `sentencepiece` crate here — it statically links its own protobuf,
# which clashes (ODR) with ONNX Runtime's bundled protobuf and corrupts ORT's
# model parsing ("Protobuf parsing failed").
tokenizers = { workspace = true }
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
rlx-gguf = { workspace = true }
rlx-assets = { workspace = true, features = ["rlxp", "native-pack"] }
# Native RLX runtime: imports the ONNX graphs → rlx-ir → compiled graphs (no ORT).
rlx-tiny-tts = { path = "../rlx-tiny-tts", version = "0.2.19", default-features = false }
rlx-core = { workspace = true, optional = true }

[dependencies.hf-hub]
workspace = true
optional = true

[features]
# `export::export_rlxp`: MOSS-TTS-Nano as an `.rlxp` package (its graphs rlx
# IR, its frame loop a program).
export = ["dep:rlx-core", "rlx-core/export", "rlx-tiny-tts/export"]
# Native only (rlx-onnx-import → rlx runtime, NO ONNX Runtime). ort/onnx removed.
default = []
metal = ["rlx-runtime/metal", "rlx-tiny-tts/metal"]
mlx = ["rlx-runtime/mlx", "rlx-tiny-tts/mlx"]
cuda = ["rlx-runtime/cuda", "rlx-tiny-tts/cuda"]
gpu = ["rlx-runtime/gpu", "rlx-tiny-tts/gpu"]
coreml = ["rlx-runtime/coreml", "rlx-tiny-tts/coreml"]
vulkan = ["rlx-runtime/vulkan", "rlx-tiny-tts/vulkan"]
all-backends = ["metal", "mlx", "cuda", "gpu", "vulkan", "coreml"]
macos-gpu = ["metal", "mlx", "gpu", "coreml"]
hf-download = ["dep:hf-hub"]

[dev-dependencies]
rlx-runtime = { workspace = true, features = ["program"] }
rlx-text = { workspace = true }
tempfile = "3"
rlx-whisper = { workspace = true }

[[bin]]
name = "rlx-moss-nano"
path = "src/bin/rlx_moss_nano.rs"

[[example]]
name = "backend_matrix"
# Device-agnostic at runtime (guards on `is_available`); build with whatever
# backend features are enabled (`macos-gpu` on Mac, `cuda` on NVIDIA).

[lints]
workspace = true
