[package]
name = "rlx-inflect-nano"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Inflect-Nano-v1 English text-to-speech (FastSpeech-style + Snake HiFi-GAN) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
safetensors = { workspace = true }
ndarray = "0.16"
hound = "3"
once_cell = "1"
regex = "1"

# rlx-ir graph path (multi-backend) + CLI registration are optional so the
# host-eager CPU reference + tests build without the compiler/CLI stack.
rlx-runtime = { workspace = true, optional = true, default-features = false, features = ["cpu"] }
rlx = { workspace = true, optional = true, default-features = false }
# Not optional: `RLX_*` settings are read through `rlx_ir::env` everywhere.
rlx-ir = { workspace = true }
# Versatile bundle loading (dir / packed file / in-memory). Optional: only the
# heavier graph build (which already pulls the rlx stack) exposes `load`; the
# lean host-eager build keeps just `load_from_dir`.
rlx-core = { workspace = true, optional = true }


# The workspace pin carries no regex backend (see the root Cargo.toml).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { workspace = true, features = ["onig"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { workspace = true, features = ["unstable_wasm"] }

[dependencies.hf-hub]
workspace = true
optional = true

[features]
default = ["rlx-graph"]
# Build the rlx-ir graph backend (compiles per device → runs on every rlx backend).
rlx-graph = ["dep:rlx", "dep:rlx-runtime", "dep:rlx-core", "rlx/cpu", "rlx-runtime/cpu"]
metal = ["rlx-graph", "rlx-runtime/metal", "rlx?/metal"]
mlx = ["rlx-graph", "rlx-runtime/mlx", "rlx?/mlx"]
cuda = ["rlx-graph", "rlx-runtime/cuda", "rlx?/cuda"]
rocm = ["rlx-graph", "rlx-runtime/rocm", "rlx?/rocm"]
gpu = ["rlx-graph", "rlx-runtime/gpu", "rlx?/gpu"]
vulkan = ["rlx-graph", "rlx-runtime/vulkan", "rlx?/gpu"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
macos-gpu = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
hf-download = ["dep:hf-hub"]
# `export::export_rlxp`: Inflect-Nano as an `.rlxp` package rlx runs alone.
export = ["rlx-graph", "rlx-core/export"]

[dev-dependencies]
tempfile = "3"
# The package's program (`tests/export_rlxp.rs`).
rlx-runtime = { workspace = true, features = ["program"] }

[[bin]]
name = "rlx-inflect-nano"
path = "src/bin/rlx_inflect_nano.rs"

[[example]]
name = "load_sources"
required-features = ["rlx-graph"]

[lints]
workspace = true
