# Inflect-Nano's host logic as an RLX program (WebAssembly, wasm32-wasip1):
# the crate's own text frontend (`src/frontend`, with `src/weights.rs` and
# `src/ops.rs` its g2p reads), the durations, the frame layout and the
# output normalization between the package's graphs. Built by
# `rlx-inflect-nano`'s exporter, so it stands outside the workspace.
[package]
name = "rlx-inflect-nano-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
serde_json = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
safetensors = "0.7"
ndarray = "0.16"
once_cell = "1"
regex = "1"
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }

[workspace]
