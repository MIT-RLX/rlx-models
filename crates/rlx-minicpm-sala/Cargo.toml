[package]
name = "rlx-minicpm-sala"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "MiniCPM-SALA (sparse + Lightning linear attention hybrid) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
rlx-qwen3 = { workspace = true }
# `nn`: the bf16 graph builder with streaming upload (shared with the fish LMs).
rlx-fish = { workspace = true }
safetensors = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }
web-time = "1"

[dev-dependencies]

[features]
default = []
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
macos-gpu = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]

[[bin]]
name = "rlx-minicpm-sala"
path = "src/bin/rlx_minicpm_sala.rs"

[lints]
workspace = true
