[package]
name = "rlx-flint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Recursive Flint (40B-A2.5B MoE coding model: sliding/full hybrid attention with learned sinks, sigmoid-routed 256-expert MoE) for RLX, with experts paged off disk"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
half = { workspace = true }
libc = "0.2"
memmap2 = "0.9"
rayon = "1.10"
safetensors = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true, features = ["onig"] }
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
# The group-limited top-k gate kernel (CPU / Metal / MLX), used here with one
# group as Flint's sigmoid router.
rlx-cpu = { workspace = true }
rlx-llada2 = { workspace = true }
rlx-runtime = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
metal = ["rlx-runtime/metal", "rlx-llada2/metal"]
mlx = ["rlx-runtime/mlx", "rlx-llada2/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
macos-gpu = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[[bin]]
name = "rlx-flint"
path = "src/bin/rlx_flint.rs"

[lints]
workspace = true
