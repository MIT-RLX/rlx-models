[package]
name = "rlx-llama4"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Llama-4 (MoE text + iRoPE, early-fusion vision) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
safetensors = { workspace = true }
half = { workspace = true }
tokenizers = { workspace = true }
image = { workspace = true }

[[bin]]
name = "rlx-llama4"
path = "src/bin/rlx_llama4.rs"

[dev-dependencies]
rlx-opscope = { workspace = true }
# The export test opens the package as any rlx program does.
rlx-text = { workspace = true }
tempfile = "3"

[lints]
workspace = true

[features]
default = []
# `export::export_rlxp`: a checkpoint as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
coreml = ["rlx-runtime/coreml", "rlx-core/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
macos-gpu = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]
