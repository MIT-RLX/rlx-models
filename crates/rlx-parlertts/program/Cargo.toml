# Parler-TTS's host logic as an RLX program (WebAssembly): the sampling loop
# around the package's graphs. Built by `rlx-parlertts`'s exporter, so it
# stands outside the workspace.
[package]
name = "rlx-parlertts-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
serde_json = "1"

[workspace]
