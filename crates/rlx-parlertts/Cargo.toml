[package]
name = "rlx-parlertts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Parler-TTS Mini v1 (878M) voice description controlled TTS for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
rlx-whisper = { workspace = true, optional = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
safetensors = { workspace = true }
hound = "3"
tokenizers = { workspace = true }
# Native (ort-free) path: import the 2 ONNX graphs → rlx-ir → compile → run.
rlx-ir = { workspace = true }
rlx-onnx-import = { workspace = true }
# Descript DAC 44.1kHz/9-codebook decoder (Parler's audio codec).
rlx-dac = { workspace = true }

[lints]
workspace = true

# ort is DEV-only (validation/parity), never a runtime dep — per project constraint.
# Feature set mirrors rlx-chatterbox (the bare download-binaries path fails the
# ort-sys TLS build script).
[dev-dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = [
    "std",
    "pkg-config",
    "download-binaries",
    "tls-rustls",
    "ndarray",
] }
ndarray = "0.17"
rlx-whisper = { workspace = true }

[[bin]]
name = "rlx-parlertts"
path = "src/bin/rlx_parlertts.rs"

[[example]]
name = "import_probe"

[[example]]
name = "native_parity"

[[example]]
name = "bcast_repro"

[[example]]
name = "mask_probe"

[[example]]
name = "mask_shapes"

[[example]]
name = "synthesize"

[[example]]
name = "dac_check"

[features]
default = []
# Kept for ABI compatibility with callers that still pass `--features native`.
native = []
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
coreml = ["rlx-runtime/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
