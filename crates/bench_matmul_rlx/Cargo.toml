# Standalone crate (workspace.exclude in the root Cargo.toml).
# Auto-generated ONNX decompose bench; not published. Run with:
#   cargo run --manifest-path crates/bench_matmul_rlx/Cargo.toml --release

[package]
name = "bench_matmul_relu"
version = "0.2.14"
edition = "2021"
publish = false
description = "RLX native model decomposed from ONNX (auto-generated)"

[dependencies]
anyhow = "1"
rlx-ir = { version = "=0.2.10" }
rlx-runtime = { version = "=0.2.10", default-features = false, features = ["cpu"] }
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["cpu"]
cpu = ["rlx-runtime/cpu"]
cuda = ["rlx-runtime/cuda"]
metal = ["rlx-runtime/metal"]
