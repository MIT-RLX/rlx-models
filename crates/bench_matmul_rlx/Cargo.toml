# Standalone crate (workspace.exclude in the root Cargo.toml).
# Auto-generated ONNX decompose bench; not published. Run with:
#   cargo run --manifest-path crates/bench_matmul_rlx/Cargo.toml --release

[package]
name = "bench_matmul_relu"
version = "0.2.14"
edition = "2021"
publish = false
description = "RLX native model decomposed from ONNX (auto-generated)"

[dependencies]
anyhow = "1"
rlx-ir = { version = "0.2.14" }
rlx-runtime = { version = "0.2.14", default-features = false, features = ["cpu"] }
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `src/` is emitted by the ONNX-decompose tool, so its identifiers come from
# ONNX node names and hand-edits would be overwritten on regeneration.
# Allowed here (Cargo.toml survives a re-emit) rather than in the sources.
[lints.rust]
non_snake_case = "allow"
dead_code = "allow"

[lints.clippy]
type_complexity = "allow"
vec_init_then_push = "allow"
iter_on_single_items = "allow"
iter_cloned_collect = "allow"

[features]
default = ["cpu"]
cpu = ["rlx-runtime/cpu"]
cuda = ["rlx-runtime/cuda"]
metal = ["rlx-runtime/metal"]
