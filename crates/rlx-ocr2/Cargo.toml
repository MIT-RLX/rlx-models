[package]
name = "rlx-ocr2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Native RLX OCR: CRAFT-style text detector + CRNN/CTC recognizer + n-gram/lexicon correction"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-core = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true }
image = { workspace = true }
memmap2 = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rlx-cli = { workspace = true }

[[bin]]
name = "rlx-ocr2"
path = "src/bin/rlx_ocr2.rs"

[features]
default = []
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
coreml = ["rlx-runtime/coreml"]
blas-accelerate = ["rlx-runtime/blas-accelerate"]
all-backends = ["metal", "mlx", "cuda", "gpu", "vulkan"]
metal-mlx = ["metal", "mlx", "gpu"]

[lints]
workspace = true
