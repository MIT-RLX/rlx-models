[package]
name = "rlx-kittentts2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "KittenTTS 2 (1.7B ternary Qwen3 speech LM + chatterbox-turbo S3Gen) text-to-speech (123 built-in voices + cloning) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
rlx-ir = { workspace = true }
rlx-core = { workspace = true }
rlx-cli = { workspace = true }
rlx-gguf = { workspace = true }
rlx-qwen3 = { workspace = true }
rlx-funasr = { workspace = true }
rustfft = "6"
flate2 = { workspace = true }
rlx-torch-ckpt = { workspace = true }
anyhow = { workspace = true }
half = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
tokenizers = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate"] }
hound = "3"
regex = "1"
# Transcribes a cloning reference when no transcript is given.
rlx-whisper = { workspace = true, optional = true, features = ["tokenizer"] }

[dev-dependencies]
rlx-whisper = { workspace = true, features = ["tokenizer"] }
tempfile = "3"
rlx-text = { workspace = true }
# The package's program (`tests/export_rlxp.rs`).
rlx-runtime = { workspace = true, features = ["program"] }

[[bin]]
name = "rlx-kittentts2"
path = "src/bin/rlx_kittentts2.rs"

[features]
default = ["transcribe"]
# `export::export_rlxp`: KittenTTS 2 as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export", "rlx-qwen3/export"]
transcribe = ["dep:rlx-whisper"]
metal = ["rlx-runtime/metal", "rlx-qwen3/metal", "rlx-funasr/metal", "rlx-whisper?/metal"]
mlx = ["rlx-runtime/mlx", "rlx-qwen3/mlx", "rlx-funasr/mlx", "rlx-whisper?/mlx"]
cuda = ["rlx-runtime/cuda", "rlx-qwen3/cuda", "rlx-funasr/cuda", "rlx-whisper?/cuda"]
rocm = ["rlx-runtime/rocm", "rlx-qwen3/rocm", "rlx-funasr/rocm", "rlx-whisper?/rocm"]
gpu = ["rlx-runtime/gpu", "rlx-qwen3/gpu", "rlx-funasr/gpu", "rlx-whisper?/gpu"]
vulkan = ["rlx-runtime/vulkan", "rlx-qwen3/vulkan", "rlx-funasr/vulkan", "rlx-whisper?/vulkan"]
coreml = ["rlx-runtime/coreml", "rlx-qwen3/coreml", "rlx-funasr/coreml", "rlx-whisper?/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
macos-gpu = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]

[lints]
workspace = true
