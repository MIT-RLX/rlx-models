[package]
name = "rlx-fft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Learned FFT via butterfly networks — train for reference precision, run compiled on RLX backends"
repository.workspace = true
build = "build.rs"

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-ir = { workspace = true }
rlx-flow = { workspace = true }
rlx-runtime = { workspace = true }
rlx-opt = { workspace = true, features = ["training"] }
rlx-autodiff = { workspace = true }
rlx-compile = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
safetensors = { workspace = true }
rand = "0.8"
rustfft = "6"

[features]
default = ["cpu"]
# Fusion phase bench (`bench-fusion-phases`); pair with metal/gpu/cuda for IO-model lines.
dev = []
cpu = ["rlx-runtime/cpu"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[[bin]]
name = "rlx-fft"
path = "src/bin/rlx_fft.rs"

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
