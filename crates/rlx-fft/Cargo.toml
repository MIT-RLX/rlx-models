[package]
name = "rlx-fft"
version = "0.2.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Learned FFT via butterfly networks — train for reference precision, run compiled on RLX backends"
repository.workspace = true
build = "build.rs"

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-ir = { workspace = true }
rlx-flow = { workspace = true }
rlx-runtime = { workspace = true }
rlx-opt = { workspace = true, features = ["training"] }
rlx-autodiff = { workspace = true }
rlx-compile = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
safetensors = { workspace = true }
rand = "0.8"
rustfft = "6"
half = "2"

# WebAssembly (browser) builds: getrandom needs its JS-backed entropy source.
# Build with: RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo build \
#   --target wasm32-unknown-unknown -p rlx-fft --lib
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
default = ["cpu"]
# Fusion phase bench (`bench-fusion-phases`); pair with metal/gpu/cuda for IO-model lines.
dev = []
cpu = ["rlx-runtime/cpu"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
coreml = ["rlx-runtime/coreml"]
cuda = ["rlx-runtime/cuda"]
# Use NVIDIA cuFFT for the GPU FFT op (falls back to native kernels at runtime
# with RLX_FFT_CUFFT=0). Implies cuda.
cufft = ["cuda", "rlx-runtime/cufft"]
# Native single-kernel Stockham FFT matching cuFFT for n<=4096 (no external dep).
# Implies cuda. Takes precedence over `cufft` for its size range.
native-cuda-fft = ["cuda", "rlx-runtime/native-cuda-fft"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
# Browser targets. WebGPU runs through the portable wgpu backend (`gpu`); the
# `webgpu`/`opengl` cfg markers mirror rlx-runtime so device_ext checks resolve.
# WebGL2 (rlx-webgl) consumes IR graphs directly and is wired in the wasm shell,
# not as an rlx-runtime Device, so there is no `rlx-runtime/webgl` to enable here.
webgpu = ["gpu", "rlx-runtime/webgpu"]
opengl = ["rlx-runtime/opengl"]
web = ["webgpu"]
all-backends = ["metal", "mlx", "coreml", "cuda", "rocm", "gpu", "vulkan", "webgpu"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[[bin]]
name = "rlx-fft"
path = "src/bin/rlx_fft.rs"

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
