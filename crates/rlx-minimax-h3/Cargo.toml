[package]
name = "rlx-minimax-h3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "MiniMax-H3 (Hailuo 3.0) omni-modal video+audio generation — joint video/audio flow-matching DiT, 3D causal video VAE, DAC audio VAE — native port for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-ir = { workspace = true }
rlx-flow = { workspace = true }
rlx-runtime = { workspace = true }
rlx-opt = { workspace = true }
rlx-cpu = { workspace = true }
rlx-fft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
safetensors = { workspace = true }
half = { workspace = true }
bytemuck = { workspace = true }
anyhow = { workspace = true }
image = { workspace = true }
tokenizers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }

[dev-dependencies]
safetensors = { workspace = true }

[[bin]]
name = "rlx-minimax-h3"
path = "src/bin/rlx_minimax_h3.rs"

[lints]
workspace = true

[features]
default = []
hf-download = ["dep:hf-hub"]
tokenizer = ["dep:tokenizers"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]
