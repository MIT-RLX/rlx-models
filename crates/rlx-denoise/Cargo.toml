[package]
name = "rlx-denoise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Monte-Carlo render denoiser for RLX — guided U-Net over colour, albedo and normal, trainable end to end"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-ir = { workspace = true }
rlx-autodiff = { workspace = true }
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
anyhow = { workspace = true }

[lints]
workspace = true

[features]
default = []
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
