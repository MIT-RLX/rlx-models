[package]
name = "rlx-vibevoice-asr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "VibeVoice-ASR for RLX: BitNet GGUF (I8_S VAE + I2_S Qwen2) and Streaming-7B BF16 safetensors (dual ConvNeXt + Qwen2.5-7B chunked generate)"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-core = { workspace = true }
rlx-ir = { workspace = true }
rlx-flow = { workspace = true }
rlx-runtime = { workspace = true }
rlx-gguf = { workspace = true }
rlx-qwen3 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokenizers = { workspace = true, optional = true }

[[bin]]
name = "rlx-vibevoice-asr"
path = "src/bin/rlx_vibevoice_asr.rs"

[features]
default = ["tokenizer"]
tokenizer = ["dep:tokenizers"]
# `export::export_rlxp`: the streaming model as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export"]
cpu = ["rlx-runtime/cpu"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
coreml = ["rlx-runtime/coreml"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
macos-gpu = ["metal", "mlx", "gpu", "coreml"]

[dev-dependencies]
tempfile = "3"
rlx-text = { workspace = true }
# The package's program (`tests/export_rlxp.rs`).
rlx-runtime = { workspace = true, features = ["program"] }

[lints]
workspace = true
