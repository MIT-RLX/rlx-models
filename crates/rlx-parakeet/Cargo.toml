[package]
name = "rlx-parakeet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "NVIDIA Parakeet-TDT FastConformer transducer on RLX (Token-and-Duration Transducer)"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
anyhow           = { workspace = true }
rlx-flow         = { workspace = true }
rlx-nemotron-asr = { workspace = true }
rlx-audio-blocks = { workspace = true }
rlx-nemo         = { workspace = true }
rlx-core         = { workspace = true }
rlx-runtime      = { workspace = true }

[features]
# `export::export_rlxp`: Parakeet-TDT as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export", "rlx-nemotron-asr/export"]

[dev-dependencies]
rlx-ir = { workspace = true }
tempfile = "3"
serde_json = { workspace = true }
# The package's program (`tests/export_rlxp.rs`).
rlx-runtime = { workspace = true, features = ["program"] }

[lints]
workspace = true
