[package]
name = "rlx-llama32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "LLaMA 3.2 for RLX"
keywords.workspace = true
categories.workspace = true
readme = "README.md"
repository.workspace = true

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-qwen3 = { workspace = true }
rlx-qwen35 = { workspace = true }
rlx-ir = { workspace = true }
rlx-flow = { workspace = true }
rlx-runtime = { workspace = true }
rlx-cpu = { workspace = true }
rlx-opt = { workspace = true }
rlx-gguf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
safetensors = { workspace = true }
anyhow = { workspace = true }
tokenizers = { workspace = true, optional = true }

[features]
default = []
tokenizer = ["dep:tokenizers", "rlx-qwen35/tokenizer"]
parity-llama = ["rlx-qwen35/parity-llama"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
coreml = ["rlx-runtime/coreml", "rlx-core/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[[bin]]
name = "rlx-llama32"
path = "src/bin/rlx_llama32.rs"

[lints]
workspace = true
