[package]
name = "rlx-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "OpenAI-compatible HTTP server for RLX language models"

[dependencies]
rlx-runtime = { workspace = true }
rlx-text = { workspace = true }
rlx-qwen3 = { workspace = true }
rlx-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
axum = { version = "0.8" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
tokio-stream = { version = "0.1" }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = { version = "0.3" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[features]
default = []
metal = ["rlx-qwen3/metal", "rlx-runtime/metal"]
mlx = ["rlx-qwen3/mlx", "rlx-runtime/mlx"]

[lints]
workspace = true
