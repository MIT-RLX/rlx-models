[package]
name = "rlx-neuralhash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apple NeuralHash perceptual image hashing (360x360 CNN + 96x128 seed projection) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
anyhow = { workspace = true }
half = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# PARITY ONLY (off by default): imports the AppleNeuralHash2ONNX `model.onnx` so
# the native graph can be diffed against it. Never on the inference path.
rlx-onnx-import = { workspace = true, optional = true }

[[bin]]
name = "rlx-neuralhash"
path = "src/bin/rlx_neuralhash.rs"

[lints]
workspace = true

[features]
default = []
onnx-parity = ["dep:rlx-onnx-import"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]
