[package]
name = "rlx-asr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Native RLX streaming Conformer ASR (GGUF weights: encoder, AED, CTC, FSTs)"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"
exclude = ["tools/__pycache__", "**/.DS_Store"]

[dependencies]
rlx-runtime = { workspace = true }
rlx-gguf = { workspace = true }
rlx-ir = { workspace = true }
rlx-pkg = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "rlx-asr"
path = "src/bin/rlx_asr.rs"

[[bin]]
name = "rlx-asr-pack-gguf"
path = "src/bin/rlx_asr_pack_gguf.rs"

[features]
default = []
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
coreml = ["rlx-runtime/coreml"]
blas-accelerate = ["rlx-runtime/blas-accelerate"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]

[lints]
workspace = true
