# Kokoro's host logic as an RLX program (WebAssembly, wasm32-wasip1): the
# text frontend, the phonemizer and the glue between the package's encoder
# and decoder. Built by `rlx-kokoro`'s exporter, so it stands outside the
# workspace.
[package]
name = "rlx-kokoro-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
serde_json = "1"
fancy-regex = "0.14"
once_cell = "1"
espeak-ng = { version = "0.2.0", default-features = false }

[workspace]
