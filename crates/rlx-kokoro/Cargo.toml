[package]
name = "rlx-kokoro"
version = "0.2.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Kokoro-82M (StyleTTS2 + ISTFTNet) text-to-speech for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hound = "3"
once_cell = "1"
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
# Shared StyleTTS2 frontend (espeak phonemizer + text preprocessor) and the
# ONNX Runtime execution-provider selector are reused from rlx-kittentts — both
# are StyleTTS2-family models with the same 3-input ONNX interface. Referenced by
# path (not workspace inheritance) so its default features can be disabled.
rlx-kittentts = { path = "../rlx-kittentts", default-features = false }

[dependencies.hf-hub]
workspace = true
optional = true

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = [
    "std",
    "pkg-config",
    "download-binaries",
    "tls-rustls",
] }

[target.'cfg(target_os = "ios")'.dependencies]
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = [
    "std",
    "download-binaries",
    "tls-rustls",
] }

[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = [
    "std",
    "download-binaries",
    "tls-rustls",
    "copy-dylibs",
] }

[features]
default = ["onnx", "espeak"]
# ONNX Runtime inference path (ort) + shared ORT session builder from kittentts.
onnx = ["dep:ort", "rlx-kittentts/onnx"]
# espeak-ng phonemizer + text preprocessor (English bundled data).
espeak = ["rlx-kittentts/espeak"]
# RLX runtime backends. Apple GPU inference for the ONNX path goes through the
# CoreML execution provider; NVIDIA through CUDA; Windows through DirectML.
metal = ["rlx-runtime/metal", "rlx-kittentts/metal", "rlx-kittentts/ort-coreml"]
mlx = ["rlx-runtime/mlx", "rlx-kittentts/mlx", "rlx-kittentts/ort-coreml"]
cuda = ["rlx-runtime/cuda", "rlx-kittentts/cuda", "rlx-kittentts/ort-cuda"]
rocm = ["rlx-runtime/rocm", "rlx-kittentts/rocm", "rlx-kittentts/ort-rocm"]
gpu = ["rlx-runtime/gpu", "rlx-kittentts/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
hf-download = ["dep:hf-hub"]

[dev-dependencies]
rlx-whisper = { workspace = true }

[[bin]]
name = "rlx-kokoro"
path = "src/bin/rlx_kokoro.rs"
required-features = ["onnx"]

[lints]
workspace = true
