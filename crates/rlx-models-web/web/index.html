<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RLX models in the browser</title>
<style>
  body { font: 15px/1.45 system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
  fieldset { border: 1px solid #ccc; border-radius: 6px; margin: 1rem 0; }
  textarea, input[type=text] { width: 100%; box-sizing: border-box; font: inherit; }
  #status { color: #555; min-height: 1.4em; }
  #out { white-space: pre-wrap; background: #f6f6f6; padding: .75rem; border-radius: 6px; min-height: 2em; }
  .hidden { display: none; }
  table { border-collapse: collapse; } td { padding: .2rem .6rem; text-align: right; }
</style>
</head>
<body>
<h1>RLX models in the browser</h1>
<p>WebAssembly (CPU, SIMD), weights fetched from <code>weights/</code> of this repo.</p>

<fieldset>
  <legend>Model</legend>
  <select id="model"></select>
  <select id="backend"><option value="webgpu">WebGPU</option><option value="webgl">WebGL2</option><option value="cpu">CPU (wasm SIMD)</option></select>
  <button id="load">Load</button>
  <div id="status"></div>
</fieldset>

<fieldset id="asr" class="hidden">
  <legend>Speech recognition</legend>
  <input type="file" id="wav" accept="audio/*">
  <button id="sample">Use the JFK sample</button>
</fieldset>

<fieldset id="embed" class="hidden">
  <legend>Embeddings (cosine similarity)</legend>
  <textarea id="texts" rows="4">Which planet is known as the Red Planet?
Mars, often called the Red Planet, has a thin atmosphere.
Rust guarantees memory safety without a garbage collector.</textarea>
  <label>prompt <select id="prompt"><option>query</option><option>document</option></select></label>
  <button id="run-embed">Embed (one text per line)</button>
</fieldset>

<fieldset id="gen" class="hidden">
  <legend>Text generation (greedy)</legend>
  <input type="text" id="question" value="What is the capital of France?">
  <label>max tokens <input type="number" id="max" value="48" min="1" max="512"></label>
  <button id="run-gen">Generate</button>
</fieldset>

<div id="out"></div>
<script type="module" src="main.js"></script>
</body>
</html>
