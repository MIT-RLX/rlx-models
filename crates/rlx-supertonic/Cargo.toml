[package]
name = "rlx-supertonic"
version = "0.2.14"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Supertonic-3 (flow-matching latent TTS) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hound = "3"
unicode-normalization = "0.1"
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
# Native runtime: the four subgraphs are imported to rlx-ir via rlx-onnx-import
# and compiled per-device through TinyModel (same engine as rlx-tiny-tts /
# rlx-openvoice) — no ONNX Runtime on the default path.
rlx-tiny-tts = { workspace = true }

[dependencies.hf-hub]
workspace = true
optional = true

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = [
    "std",
    "pkg-config",
    "download-binaries",
    "tls-rustls",
] }

[target.'cfg(target_os = "ios")'.dependencies]
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = [
    "std",
    "download-binaries",
    "tls-rustls",
] }

[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = [
    "std",
    "download-binaries",
    "tls-rustls",
    "copy-dylibs",
] }

[features]
# Native RLX is the default runtime; `onnx` (ONNX Runtime) is opt-in for
# dev/validation parity only. Native backends forward to the shared TinyModel.
default = []
onnx = ["dep:ort"]
metal = ["rlx-runtime/metal", "rlx-tiny-tts/metal"]
mlx = ["rlx-runtime/mlx", "rlx-tiny-tts/mlx"]
cuda = ["rlx-runtime/cuda", "rlx-tiny-tts/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu", "rlx-tiny-tts/gpu"]
vulkan = ["rlx-runtime/vulkan", "rlx-tiny-tts/vulkan"]
coreml = ["rlx-runtime/coreml", "rlx-tiny-tts/coreml"]
all-backends = ["metal", "mlx", "cuda", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
hf-download = ["dep:hf-hub"]

[dev-dependencies]
rlx-whisper = { workspace = true }

[[bin]]
name = "rlx-supertonic"
path = "src/bin/rlx_supertonic.rs"

[lints]
workspace = true
