# Supertonic-3's host logic as an RLX program (WebAssembly, wasm32-wasip1):
# the text preprocessor and tokenizer, the voice styles, the noise and the
# flow-matching loop around the package's graphs. Built by `rlx-supertonic`'s
# exporter, so it stands outside the workspace.
[package]
name = "rlx-supertonic-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[workspace]
