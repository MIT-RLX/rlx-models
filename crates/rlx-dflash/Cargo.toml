[package]
name = "rlx-dflash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "DFlash speculative-decoding drafter for RLX (Eagle-style multi-layer-tap draft head)"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
rlx-core = { workspace = true }
rlx-ir = { workspace = true }
rlx-gguf = { workspace = true }
rlx-runtime = { workspace = true }

[features]
default = []
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]

[[example]]
name = "dflash_forward"
path = "examples/dflash_forward.rs"

[lints]
workspace = true
