[package]
name = "rlx-ppocrv6"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "PP-OCRv6 tiny/small OCR — native RLX HIR + safetensors (no runtime ONNX)"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true }
half = "2"
image = { workspace = true }
rten-imageproc = { workspace = true }
rten-tensor = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
safetensors = { workspace = true }
memmap2 = "0.9"

[[bin]]
name = "rlx-ppocrv6"
path = "src/bin/rlx_ppocrv6.rs"

[features]
default = []
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
coreml = ["rlx-runtime/coreml", "rlx-cli/coreml", "rlx-core/coreml"]
blas-accelerate = ["rlx-runtime/blas-accelerate"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[dev-dependencies]

[[test]]
name = "ppocrv6_backend_quick_check"
path = "tests/ppocrv6_backend_quick_check.rs"

[lints]
workspace = true
