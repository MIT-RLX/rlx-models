[package]
name = "rlx-f5tts"
version = "0.2.13"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "F5-TTS (flow-matching DiT voice cloning) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
hound = "3"
half = "2"
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
# ONNX Runtime execution-provider selector reused from rlx-kittentts.
rlx-kittentts = { path = "../rlx-kittentts", default-features = false }
# Native RLX path: import + compile + run the 3 F5 graphs (no ort at runtime).
rlx-tiny-tts = { path = "../rlx-tiny-tts", default-features = false }

[dependencies.hf-hub]
workspace = true
optional = true

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = [
    "std",
    "pkg-config",
    "download-binaries",
    "tls-rustls",
    "half",
] }

[features]
# Native (rlx-onnx-import → rlx runtime, NO ort) is always available. `onnx` opts
# into the ORT reference path (`F5Tts`) for parity checks.
default = []
onnx = ["dep:ort", "rlx-kittentts/onnx"]
metal = ["rlx-runtime/metal", "rlx-tiny-tts/metal", "rlx-kittentts/metal", "rlx-kittentts/ort-coreml"]
mlx = ["rlx-runtime/mlx", "rlx-tiny-tts/mlx", "rlx-kittentts/mlx", "rlx-kittentts/ort-coreml"]
cuda = ["rlx-runtime/cuda", "rlx-tiny-tts/cuda", "rlx-kittentts/cuda", "rlx-kittentts/ort-cuda"]
gpu = ["rlx-runtime/gpu", "rlx-tiny-tts/gpu", "rlx-kittentts/gpu"]
coreml = ["rlx-runtime/coreml", "rlx-tiny-tts/coreml"]
vulkan = ["rlx-runtime/vulkan", "rlx-tiny-tts/vulkan"]
all-backends = ["metal", "mlx", "cuda", "gpu", "coreml", "vulkan"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
hf-download = ["dep:hf-hub"]

[dev-dependencies]
rlx-whisper = { workspace = true }
rlx-ir = { workspace = true }
rlx-opt = { workspace = true }

[[bin]]
name = "rlx-f5tts"
path = "src/bin/rlx_f5tts.rs"

[[example]]
name = "backend_matrix"
# Build with the backends you need, e.g.:
#   --features apple-silicon
#   --features "cuda,gpu"

[[example]]
name = "ort_clone"
required-features = ["onnx"]

[lints]
workspace = true
