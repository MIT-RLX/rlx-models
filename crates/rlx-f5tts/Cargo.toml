[package]
name = "rlx-f5tts"
version = "0.2.14"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "F5-TTS (flow-matching DiT voice cloning) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
hound = "3"
half = "2"
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
# Native RLX path: import + compile + run the 3 F5 graphs (no ort at runtime).
rlx-tiny-tts = { path = "../rlx-tiny-tts", default-features = false }

[dependencies.hf-hub]
workspace = true
optional = true

[features]
# Native (rlx-onnx-import → rlx runtime, NO ort) is the only path.
default = []
metal = ["rlx-runtime/metal", "rlx-tiny-tts/metal"]
mlx = ["rlx-runtime/mlx", "rlx-tiny-tts/mlx"]
cuda = ["rlx-runtime/cuda", "rlx-tiny-tts/cuda"]
gpu = ["rlx-runtime/gpu", "rlx-tiny-tts/gpu"]
coreml = ["rlx-runtime/coreml", "rlx-tiny-tts/coreml"]
vulkan = ["rlx-runtime/vulkan", "rlx-tiny-tts/vulkan"]
all-backends = ["metal", "mlx", "cuda", "gpu", "coreml", "vulkan"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
hf-download = ["dep:hf-hub"]

[dev-dependencies]
rlx-whisper = { workspace = true }
rlx-ir = { workspace = true }
rlx-opt = { workspace = true }

[[bin]]
name = "rlx-f5tts"
path = "src/bin/rlx_f5tts.rs"

[[example]]
name = "backend_matrix"
# Build with the backends you need, e.g.:
#   --features apple-silicon
#   --features "cuda,gpu"

[lints]
workspace = true
