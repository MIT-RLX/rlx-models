[package]
name = "rlx-pocket-tts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Pocket TTS — Kyutai's lightweight TTS (FlowLM + Mimi decoder) as rlx graphs on every RLX backend"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"
build = "build.rs"
exclude = ["weights/", "voices/"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
safetensors = { workspace = true }
half = { workspace = true }
ndarray = "0.16"
hound = "3"
rand = "0.8"
rand_distr = "0.4"
sentencepiece = "0.14"

serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
rlx-core = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }

[dependencies.hf-hub]
workspace = true
optional = true

[features]
default = ["accelerate"]
# macOS/iOS only: route `linear()` through the Accelerate framework's CBLAS sgemm.
# No effect on other targets — `linear()` falls back to ndarray's dot product.
accelerate = []
hf-download = ["dep:hf-hub"]
# `export::export_rlxp`: Pocket TTS as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
coreml = ["rlx-runtime/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
macos-gpu = ["metal", "mlx", "gpu", "coreml"]

[dev-dependencies]
anyhow = { workspace = true }
rlx-whisper = { workspace = true, features = ["tokenizer"] }
tempfile = "3"
rlx-text = { workspace = true }
# The package's program (`tests/export_rlxp.rs`).
rlx-runtime = { workspace = true, features = ["program"] }

[[bin]]
name = "rlx-pocket-tts"
path = "src/bin/rlx_pocket_tts.rs"

[[example]]
name = "generate"
path = "examples/generate.rs"
required-features = ["hf-download"]

[[example]]
name = "bench"
path = "examples/bench.rs"
required-features = ["hf-download"]

[[example]]
name = "whisper_check"
path = "examples/whisper_check.rs"
required-features = ["hf-download"]

[[example]]
name = "probe"
path = "examples/probe.rs"
required-features = ["hf-download"]

[[example]]
name = "probe_backbone"
path = "examples/probe_backbone.rs"
required-features = ["hf-download"]

[[example]]
name = "probe_flow"
path = "examples/probe_flow.rs"
required-features = ["hf-download"]

[[example]]
name = "probe_trajectory"
path = "examples/probe_trajectory.rs"
required-features = ["hf-download"]

[[example]]
name = "probe_weights"
path = "examples/probe_weights.rs"
required-features = ["hf-download"]

[[example]]
name = "whisper_file"
path = "examples/whisper_file.rs"

[lints]
workspace = true
