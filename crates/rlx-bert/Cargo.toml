[package]
name = "rlx-bert"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "BERT graph builder for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-core = { workspace = true }
rlx-ir = { workspace = true }
rlx-flow = { workspace = true }
rlx-runtime = { workspace = true }
rlx-opt = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
safetensors = { workspace = true }

[dev-dependencies]
rlx-opscope = { path = "../../../rlx/crates/tooling/rlx-opscope" }
# The `rlx!` DSL examples need the umbrella `tensor` (DSL) feature on top of the
# workspace's `cpu` backend. Dev-only, so the published `rlx-bert` lib is
# unaffected.
rlx = { workspace = true, features = ["tensor"] }
# The full-BERT example fetches a real checkpoint from the HF hub at runtime.
hf-hub = { workspace = true }

[lints]
workspace = true

[features]
default = []
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]
