[package]
name = "rlx-piper"
version = "0.2.14"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Piper VITS text-to-speech for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hound = "3"
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
# Bundled espeak-ng phonemizer (reused for the espeak G2P frontend).
rlx-kittentts = { path = "../rlx-kittentts", version = "0.2.14", default-features = false }
# Native (ort-free) rlx-ir path: import + compile + run the split subgraphs.
rlx-tiny-tts = { path = "../rlx-tiny-tts", version = "0.2.14", default-features = false, optional = true }

[dependencies.hf-hub]
workspace = true
optional = true

[features]
default = ["native", "espeak"]
espeak = ["rlx-kittentts/espeak"]
# Native (ort-free) multi-backend path over rlx-onnx-import + rlx-ir.
native = ["dep:rlx-tiny-tts"]
# Native Apple CoreML / Neural Engine path (`--device ane`).
coreml = ["native", "rlx-tiny-tts/coreml"]
metal = ["rlx-runtime/metal", "rlx-kittentts/metal", "rlx-tiny-tts?/metal"]
mlx = ["rlx-runtime/mlx", "rlx-kittentts/mlx", "rlx-tiny-tts?/mlx"]
cuda = ["rlx-runtime/cuda", "rlx-kittentts/cuda", "rlx-tiny-tts?/cuda"]
gpu = ["rlx-runtime/gpu", "rlx-kittentts/gpu", "rlx-tiny-tts?/gpu"]
vulkan = ["native", "rlx-runtime/vulkan", "rlx-tiny-tts/vulkan"]
all-backends = ["metal", "mlx", "cuda", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
hf-download = ["dep:hf-hub"]

[dev-dependencies]
rlx-whisper = { workspace = true }

[[bin]]
name = "rlx-piper"
path = "src/bin/rlx_piper.rs"
required-features = ["native", "espeak"]

[[example]]
name = "native_synthesize"
required-features = ["native", "espeak"]

[lints]
workspace = true
