# ChatterBox's host logic as an RLX program (WebAssembly, wasm32-wasip1): the
# reference's conditioning, the prompt, the sampling loop, the CFM solver and
# the vocoder's inverse STFT between the package's graphs. Built by
# `rlx-chatterbox`'s exporter, so it stands outside the workspace.
[package]
name = "rlx-chatterbox-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
serde_json = "1"

[workspace]
