# Decomposed Kitten ONNX model — `rlx*` deps via workspace (crates.io 0.2.6).

[package]
name = "kitten_tts_mini_rlx"
version = "0.2.13"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "RLX native KittenTTS graph decomposed from ONNX (weights downloaded separately)"
keywords.workspace = true
categories.workspace = true
exclude = [
    "weights/**",
    "decompose_report.json",
]

[dependencies]
anyhow = { workspace = true }
rlx-cpu = { workspace = true }
rlx-ir = { workspace = true }
rlx-onnx-import = { workspace = true }
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
rlx-opt = { workspace = true }
rlx-compile = { workspace = true }
dirs = "6"
safetensors = { workspace = true }
half = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rlx-metal = { workspace = true, optional = true }
rlx-mlx = { workspace = true, optional = true }
rlx-cuda = { workspace = true, optional = true }
rlx-gguf = { workspace = true, optional = true }
metal = { version = "0.30", optional = true }

[[example]]
name = "native_quick"
path = "examples/native_quick.rs"
required-features = ["native"]

[[example]]
name = "compile_check"
path = "examples/compile_check.rs"
required-features = ["native"]

[[example]]
name = "native_weights_compile_check"
path = "examples/native_weights_compile_check.rs"
required-features = ["native"]

[[example]]
name = "duration_parity"
path = "examples/duration_parity.rs"

[[example]]
name = "dump_lir_shapes"
path = "examples/dump_lir_shapes.rs"

[[example]]
name = "compare_intermediates"
path = "examples/compare_intermediates.rs"

[[example]]
name = "cpu_device_probe"
path = "examples/cpu_device_probe.rs"

[[example]]
name = "qmatmul_probe"
path = "examples/qmatmul_probe.rs"

[[example]]
name = "ort_prosody_inject"
path = "examples/ort_prosody_inject.rs"
required-features = ["native"]

[features]
default = ["cpu"]
cpu = ["rlx-runtime/cpu"]
cuda = ["rlx-runtime/cuda", "dep:rlx-cuda"]
metal = ["rlx-runtime/metal", "dep:rlx-metal", "dep:metal"]
mlx = ["rlx-runtime/mlx", "dep:rlx-mlx"]
gpu = ["rlx-runtime/gpu"]
rocm = ["rlx-runtime/rocm"]
# Data-driven native path: safetensors/GGUF weights + `rlx_bundle/graph.json`
# imported via rlx-onnx-import (no ONNX Runtime). This is the sole native path;
# the ~100k-line transpiled `graph.rs` fallback was removed (git history has it).
native = ["dep:rlx-gguf"]
# Production infer defaults (`KITTEN_RLX_INFER=production` without env).
native-fast = []

[[example]]
name = "dump_one_node"
path = "examples/dump_one_node.rs"

[[example]]
name = "debug_input_arena"
path = "examples/debug_input_arena.rs"

[dev-dependencies]
anyhow = { workspace = true }

[lints]
workspace = true


