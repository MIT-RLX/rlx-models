[package]
name = "rlx-qwen3-tts"
version = "0.2.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Qwen3-TTS for RLX — talker (Qwen3-shaped) + code predictor + 12Hz codec path"
keywords.workspace = true
categories.workspace = true
readme = "README.md"
repository.workspace = true

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
rlx-qwen3 = { workspace = true }
rlx-cpu = { workspace = true }
rlx-fft = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
safetensors = { workspace = true }
tokenizers = { workspace = true }
ndarray = { version = "0.16", features = ["matrixmultiply-threading", "rayon", "blas"] }
rayon = "1.10"
memmap2 = "0.9"
rand = "0.8"
futures-core = { version = "0.3", optional = true }
futures-channel = { version = "0.3", optional = true }
# tokio runtime is opt-in; users on tokio can also just wrap the sync API in
# `tokio::task::spawn_blocking` themselves without enabling this feature.
tokio = { version = "1", features = ["sync", "rt"], optional = true, default-features = false }
# Live mic capture + speaker playback for the `qwen_voice_chat` example. Optional:
# off by default so the WAV-driven path (used by tests) needs no audio backend.
cpal = { version = "0.15", optional = true }

[[bin]]
name = "rlx-qwen3-tts"
path = "src/bin/rlx_qwen3_tts.rs"

[[bin]]
name = "bench_voice_clone"
path = "src/bin/bench_voice_clone.rs"

[[bin]]
name = "jfk_voice_clone"
path = "src/bin/jfk_voice_clone.rs"

[[bin]]
name = "replay_codes"
path = "src/bin/replay_codes.rs"

[[bin]]
name = "bench_bf16_matvec"
path = "src/bin/bench_bf16_matvec.rs"

[[bin]]
name = "bench_amx_batch"
path = "src/bin/bench_amx_batch.rs"

[[bin]]
name = "bench_sgemm_orient"
path = "src/bin/bench_sgemm_orient.rs"

[[bin]]
name = "speaker_cosine"
path = "src/bin/speaker_cosine.rs"

[features]
default = []
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
hf-download = ["dep:hf-hub"]
async = ["dep:futures-core", "dep:futures-channel"]
tokio = ["dep:tokio"]
# Live microphone input + speaker playback for the `qwen_voice_chat` example.
mic = ["dep:cpal"]
# qwen_voice_chat: splice Qwen3-ASR transcript token ids straight into the LM
# prompt (shared Qwen3 vocab) instead of detokenize→retokenize. Stateless turns
# only (--history 0). Small latency win; removes the language-tag string hack.
fused-tokens = []
# True incremental decoder for live streaming: KV-cached pre-transformer +
# per-stage causal-conv state, so the decoder runs in O(N) total instead of
# O(N²/K) when called once per chunk in Progressive mode. Currently EXPERIMENTAL;
# falls back to the non-incremental path if not enabled.
incremental-decode = []
# Talker speculative decoding with a small draft model. Drafts K talker tokens,
# verifies them in a single batched forward of the big talker, accepts the
# longest matching prefix, regenerates from the mismatch. First cut uses a
# trivial draft (predict-same-as-last); a learned draft can plug in behind the
# same trait without touching the verification loop. EXPERIMENTAL.
speculative-decode = []
# Dev-only: Whisper ASR round-trip in `speculative_walkthrough` (not for release builds).
dev-whisper-validate = []

[dependencies.hf-hub]
workspace = true
optional = true

[dev-dependencies]
rlx-whisper = { workspace = true, features = ["tokenizer"] }
rlx-aec = { workspace = true }
# All-Qwen voice chat example (`qwen_voice_chat`): Qwen3-ASR in place of Whisper.
rlx-qwen3-asr = { workspace = true }

[[example]]
name = "speculative_walkthrough"
required-features = ["speculative-decode"]

[lints]
workspace = true
