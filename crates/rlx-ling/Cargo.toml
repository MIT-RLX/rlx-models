[package]
name = "rlx-ling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Ling 3.0 / BailingMoeV3 (inclusionAI) — hybrid KDA + MLA attention with fine-grained MoE — for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-deepseek = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-llada2 = { workspace = true }
rlx-runtime = { workspace = true }
anyhow = { workspace = true }
half = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }

[dev-dependencies]
libc = "0.2"

[lints]
workspace = true

[features]
default = []
metal = ["rlx-runtime/metal", "rlx-deepseek/metal"]
mlx = ["rlx-runtime/mlx", "rlx-deepseek/mlx"]
cuda = ["rlx-runtime/cuda", "rlx-deepseek/cuda"]
rocm = ["rlx-runtime/rocm", "rlx-deepseek/rocm"]
gpu = ["rlx-runtime/gpu", "rlx-deepseek/gpu"]
vulkan = ["rlx-runtime/vulkan", "rlx-deepseek/vulkan"]
coreml = ["rlx-runtime/coreml", "rlx-core/coreml", "rlx-deepseek/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]
