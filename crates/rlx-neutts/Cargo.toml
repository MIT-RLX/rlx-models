[package]
name = "rlx-neutts"
version = "0.2.11"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "NeuTTS voice-cloning TTS — GGUF backbone + NeuCodec decoder for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
build = "build.rs"
exclude = ["models/"]

[dependencies]
anyhow = { workspace = true }
thiserror = "1"
once_cell = "1"
regex = "1"
rand = "0.8"
safetensors = { workspace = true }
rustfft = "6"
ndarray = "0.16"
memmap2 = "0.9"
encoding_rs = "0.8"

# RLX Llama-shaped backbone (rlx-models).
rlx-llama-base = { workspace = true, optional = true }
rlx-llama32 = { workspace = true, optional = true }
rlx-qwen3 = { workspace = true, optional = true }
rlx-qwen35 = { workspace = true, optional = true }
rlx-core = { workspace = true, optional = true }
rlx-runtime = { workspace = true, optional = true }
rlx = { workspace = true, optional = true }

# llama.cpp reference for parity tests only.
llama-cpp-2 = { workspace = true, optional = true }

[dependencies.burn]
version = "0.20"
optional = true
default-features = false
features = ["std", "wgpu", "ndarray"]

[features]
default = ["codec", "fast", "llama"]
codec = []
# Production backbone: rlx-llama32 (+ GGUF vocab encode/decode from rlx-qwen35).
llama = [
    "dep:rlx-llama-base",
    "dep:rlx-llama32",
    "dep:rlx-qwen3",
    "dep:rlx-qwen35",
    "dep:rlx-runtime",
    "dep:rlx-core",
    "rlx-llama32/tokenizer",
]
backbone = ["llama"]
# llama.cpp cross-check (requires `llama` for side-by-side parity tests).
parity-llama-cpp = ["dep:llama-cpp-2", "llama", "rlx-qwen35/parity-llama"]
burn = ["dep:burn"]
wgpu = ["burn"]
rlx = ["dep:rlx"]
fast = []
precise = []
metal = ["rlx-llama32/metal"]
mlx = ["rlx-llama32/mlx"]
cuda = ["rlx-llama32/cuda"]
rocm = ["rlx-llama32/rocm"]
vulkan = ["rlx-llama32/vulkan"]
gpu = ["rlx-llama32/gpu"]
# Burn wgpu for NeuCodec + RLX backbone device features (orthogonal stacks).
burn-gpu = ["burn", "wgpu"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "burn-gpu"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu", "vulkan"]

[dev-dependencies]
# parity-llama-cpp only for tests/llama_greedy_parity.rs (see that file's required-features).
rlx-neutts = { path = ".", features = ["codec", "fast", "llama", "rlx"] }
rlx-qwen35 = { workspace = true }

[lints]
workspace = true
