[package]
name = "rlx-zonos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Zonos v0.1 (1.6B transformer + DAC 44kHz, Apache-2.0) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-runtime = { workspace = true, default-features = false, features = ["cpu"] }
rlx-core = { workspace = true }
rlx-ir = { workspace = true }
rlx-cli = { workspace = true }
rlx-dac = { workspace = true }
rlx-kittentts = { workspace = true, optional = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
safetensors = { workspace = true }
hound = "3"
matrixmultiply = "0.3"
# `export`: espeak-ng's English data for the package's program.
espeak-ng = { version = "0.2.0", optional = true, default-features = false, features = ["bundled-data-en"] }
tempfile = { version = "3", optional = true }

[dev-dependencies]
rlx-whisper = { workspace = true }
rlx-text = { workspace = true }
# The package's program (`tests/export_rlxp.rs`).
rlx-runtime = { workspace = true, features = ["program"] }

[[bin]]
name = "rlx-zonos"
path = "src/bin/rlx_zonos.rs"

[features]
default = ["espeak"]
# `export::export_rlxp`: Zonos as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export", "rlx-dac/export", "dep:espeak-ng", "dep:tempfile"]
espeak = ["dep:rlx-kittentts", "rlx-kittentts/espeak"]
metal = ["rlx-runtime/metal", "rlx-dac/metal"]
mlx = ["rlx-runtime/mlx", "rlx-dac/mlx"]
cuda = ["rlx-runtime/cuda", "rlx-dac/cuda"]
rocm = ["rlx-runtime/rocm", "rlx-dac/rocm"]
gpu = ["rlx-runtime/gpu", "rlx-dac/gpu"]
vulkan = ["rlx-runtime/vulkan", "rlx-dac/vulkan"]
coreml = ["rlx-runtime/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
macos-gpu = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]

[lints]
workspace = true
