# Zonos's host logic as an RLX program (WebAssembly, wasm32-wasip1): the
# phonemizer, the conditioning rows, the delay-pattern loop with classifier-
# free guidance, and the glue to DAC. Built by `rlx-zonos`'s exporter, so it
# stands outside the workspace.
[package]
name = "rlx-zonos-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
serde_json = "1"
espeak-ng = { version = "0.2.0", default-features = false }

[workspace]
