[package]
name = "rlx-voxtral-tts-train"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "RLX autodiff training for Voxtral voice cloning — codec encoder + LoRA"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
rlx-opt = { workspace = true, features = ["training"] }
rlx-autodiff = { workspace = true }
rlx-compile = { workspace = true }
rlx-voxtral-tts = { workspace = true }
rlx-whisper = { workspace = true }
rlx-llama32 = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
safetensors = { workspace = true }
half = { workspace = true }
hound = "3.5"
rand = "0.8"
tokenizers = { workspace = true }

[features]
default = ["cpu"]
cpu = ["rlx-runtime/cpu"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
apple-silicon = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[[bin]]
name = "rlx-voxtral-tts-train"
path = "src/bin/rlx_voxtral_tts_train.rs"

[[bin]]
name = "bench-encoder"
path = "src/bin/bench_encoder.rs"

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
