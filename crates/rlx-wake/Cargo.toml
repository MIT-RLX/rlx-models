[package]
name = "rlx-wake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared wake-word streaming API, mel frontend, and CNN primitives for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-runtime = { workspace = true }
rlx-cpu = { workspace = true }
anyhow = { workspace = true }
safetensors = { workspace = true }
serde_json = { workspace = true, optional = true }
rlx-ir = { workspace = true, optional = true }

[[bin]]
name = "rlx-wake-train"
path = "src/bin/rlx_wake_train.rs"

[features]
default = []
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
macos-gpu = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]
# `export::export_family`: a wake CNN as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export", "dep:serde_json", "dep:rlx-ir"]

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
# The package's program (`tests/export_rlxp.rs`).
rlx-runtime = { workspace = true, features = ["program"] }

[[test]]
name = "export_rlxp"
path = "tests/export_rlxp.rs"
required-features = ["export"]

[[test]]
name = "backend_quick_check"
path = "tests/backend_quick_check.rs"

[[test]]
name = "backend_parity"
path = "tests/backend_parity.rs"

[[test]]
name = "train_quick"
path = "tests/train_quick.rs"

[[test]]
name = "train_backends"
path = "tests/train_backends.rs"

[[example]]
name = "wake_bench"
path = "examples/wake_bench.rs"

[lints]
workspace = true
