# The wake CNN's host logic as an RLX program (WebAssembly): the engines'
# streaming, chunk by chunk, over the package's mel and score graphs, and
# the firing. Built by `rlx-wake`'s exporter, so it stands
# outside the workspace.
[package]
name = "rlx-wake-program"
version = "0.2.19"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rlx-program = "0.2.19"
serde_json = "1"

[workspace]
