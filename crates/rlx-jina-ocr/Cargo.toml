[package]
name = "rlx-jina-ocr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "jinaai/jina-ocr-v1 (DeepSeek-OCR DeepEncoder + MoE LM + FastMTP) for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-ir = { workspace = true }
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-runtime = { workspace = true }
rlx-unlimited-ocr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
image = { workspace = true }
tokenizers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }

[features]
default = ["tokenizer", "hf-cache", "hf-download"]
tokenizer = ["dep:tokenizers", "rlx-unlimited-ocr/tokenizer"]
hf-cache = ["dep:hf-hub", "rlx-unlimited-ocr/hf-cache"]
hf-download = ["hf-cache", "rlx-unlimited-ocr/hf-download"]
metal = ["rlx-runtime/metal", "rlx-unlimited-ocr/metal"]
mlx = ["rlx-runtime/mlx", "rlx-unlimited-ocr/mlx"]
cuda = ["rlx-runtime/cuda", "rlx-unlimited-ocr/cuda"]
rocm = ["rlx-runtime/rocm", "rlx-unlimited-ocr/rocm"]
gpu = ["rlx-runtime/gpu", "rlx-unlimited-ocr/gpu"]
vulkan = ["rlx-runtime/vulkan", "rlx-unlimited-ocr/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
macos-gpu = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[[bin]]
name = "rlx-jina-ocr"
path = "src/bin/rlx_jina_ocr.rs"

[dev-dependencies]
anyhow = { workspace = true }
image = { workspace = true }
rlx-core = { workspace = true }
rlx-runtime = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
