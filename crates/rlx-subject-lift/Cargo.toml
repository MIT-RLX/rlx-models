[package]
name = "rlx-subject-lift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Vision-framework subject lifting (foreground saliency) run natively by RLX from the model macOS ships"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-core = { workspace = true }
rlx-flow = { workspace = true }
rlx-ir = { workspace = true }
rlx-neuralhash = { workspace = true }
rlx-runtime = { workspace = true }
anyhow = { workspace = true }
image = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }

[lints]
workspace = true

[features]
default = []
# `export::export_rlxp`: subject lifting as an `.rlxp` package rlx runs alone.
export = ["rlx-core/export"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
macos-gpu = ["metal", "mlx", "gpu"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]
