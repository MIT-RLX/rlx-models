[package]
name = "rlx-qwen35"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Qwen3.5 / Qwen3.6 hybrid trunk for RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
rlx-cli = { workspace = true }
rlx-core = { workspace = true }
rlx-qwen3 = { workspace = true }
rlx-llada2 = { workspace = true }
rlx-ir = { workspace = true }
rlx-flow = { workspace = true }
rlx-runtime = { workspace = true }
rlx-opt = { workspace = true }
rlx-cpu = { workspace = true }
rlx-gguf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
safetensors = { workspace = true }
tokenizers = { workspace = true, optional = true }
image = { workspace = true, optional = true }
llama-cpp-2 = { workspace = true, optional = true }

# Decodes an image with the `image` crate, so it needs the VLM feature that
# pulls that optional dep in (workspace builds unify it in; a standalone
# `-p rlx-qwen35` / `cargo publish` build does not).
[[example]]
name = "dump_vision_emb"
required-features = ["qwen35-vlm"]

[[example]]
name = "fara_image_reuse"
required-features = ["qwen35-vlm", "qwen35-tokenizer"]

[features]
default = ["tokenizer"]
tokenizer = ["dep:tokenizers", "qwen35-tokenizer"]
# Alias matching the cfg gates in src/tokenizer.rs / src/chat.rs — those
# checks use `feature = "qwen35-tokenizer"` and would otherwise always
# fall through to the "support not compiled" branch.
qwen35-tokenizer = ["dep:tokenizers"]
qwen35-vlm = ["dep:image"]
parity-llama = ["dep:llama-cpp-2"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
coreml = ["rlx-runtime/coreml", "rlx-core/coreml"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[[bin]]
name = "rlx-qwen35"
path = "src/bin/rlx_qwen35.rs"

[lints]
workspace = true
