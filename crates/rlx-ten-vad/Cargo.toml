[package]
name = "rlx-ten-vad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "TEN-VAD (TEN Framework) voice activity detection on RLX"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
rlx-cli = { workspace = true }
# The no_std half: DSP frontend + scalar net, shared with MCU/FPGA targets.
rlx-ten-vad-core = { workspace = true }
rlx-core = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
anyhow = { workspace = true }

[[test]]
name = "fpga_export"
path = "tests/fpga_export.rs"

[dev-dependencies]
rlx-fpga = { workspace = true }
rlx-tensor = { workspace = true, features = ["dsl", "optim"] }
rlx-optim = { workspace = true }
hf-hub = { workspace = true }
parquet = { workspace = true }
symphonia = { workspace = true }

[[bin]]
name = "rlx-ten-vad"
path = "src/bin/rlx_ten_vad.rs"

[[test]]
name = "reference_parity"
path = "tests/reference_parity.rs"

[[example]]
name = "ten_vad_bench"
path = "examples/ten_vad_bench.rs"

[[example]]
name = "ooura_probe"
path = "examples/ooura_probe.rs"

[[example]]
name = "dump_stages"
path = "examples/dump_stages.rs"

[features]
default = []
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan", "coreml"]
# Forwarded so the parity fixtures can be run against the faster pitch path.
# It is not bit-identical to the C DSP by construction — see the core crate.
fast-pitch = ["rlx-ten-vad-core/fast-pitch"]
# Report the activation ranges that set the integer net's accumulator width.
range-probe = ["rlx-ten-vad-core/range-probe"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
# Apple Neural Engine via CoreML (`Device::Ane`).
coreml = ["rlx-runtime/coreml"]
# Apple matrix units. `Device::Cpu` ALREADY goes through Accelerate — rlx-cpu's
# `blas` feature is default-on and links the framework, which *is* the AMX path
# for dense f32 — so these are not needed to get AMX. They swap in rlx-cpu's own
# kernels instead: `amx-sme` a hand-written ARM SME2 microkernel (M4+, gated on
# FEAT_SME2 at run time), `amx-bnns` BNNS low-precision matmul.
amx-sme = ["rlx-runtime/amx-sme"]
amx-bnns = ["rlx-runtime/amx-bnns"]
apple-silicon = ["metal", "mlx", "gpu", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]
portable-gpu = ["gpu"]

[lints]
workspace = true

# Needs the instrumented net; without the feature the probe fields do not exist.
[[example]]
name = "int_ranges"
required-features = ["range-probe"]
