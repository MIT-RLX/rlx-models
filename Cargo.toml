# rlx-mamba-bench is an opt-in head-to-head bench against burn-mamba.
# It pulls in the entire burn dep graph, so we keep it out of the
# default workspace build. Run with: `cargo bench --manifest-path
# crates/rlx-mamba-bench/Cargo.toml`.
#
exclude = [
    "crates/rlx-mamba-bench",
    # Auto-generated ONNX decompose bench; publish = false, opt-in manifest-path builds.
    "crates/bench_matmul_rlx",
]

[workspace.package]
version       = "0.2.14"
edition       = "2024"
rust-version  = "1.87"
license       = "GPL-3.0-only"
authors       = ["Eugene Hauptmann", "Nataliya Kosmyna"]
repository    = "https://github.com/MIT-RLX/rlx-models"
homepage      = "https://github.com/MIT-RLX/rlx-models"
documentation = "https://docs.rs/rlx-models"
keywords      = ["ml", "tensor", "compiler", "neural-network"]
categories    = ["science", "algorithms"]

[workspace.dependencies]
# Published `rlx*` (crates.io 0.2.14). Crates use `{ workspace = true }`.
# Local ../rlx override: `.cargo/config.toml` from `.cargo/config.toml.example` (gitignored).
# `rlx-distributed` needs rlx-driver 0.2.14+ (`ProcessGroup`, `TcpTransport`, …).
# Publish / CI without patch: requires rlx 0.2.14 on crates.io.
rlx = { version = "^0.2.14", default-features = false, features = ["cpu"] }
rlx-ir = { version = "^0.2.14" }
rlx-flow = { version = "^0.2.14" }
rlx-runtime = { version = "^0.2.14", default-features = false, features = ["cpu"] }
rlx-driver = { version = "^0.2.14" }
rlx-opt = { version = "^0.2.14" }
rlx-optim = { version = "^0.2.14" }
rlx-autodiff = { version = "^0.2.14" }
rlx-compile = { version = "^0.2.14" }
rlx-fusion = { version = "^0.2.14" }
rlx-cpu = { version = "^0.2.14" }
rlx-gguf = { version = "^0.2.14" }
rlx-pkg = { version = "^0.2.14" }
rlx-text = { version = "^0.2.14" }
rlx-metal = { version = "^0.2.14" }
rlx-mlx = { version = "^0.2.14" }
rlx-cuda = { version = "^0.2.14" }
rlx-wgpu = { version = "^0.2.14" }
rlx-rocm = { version = "^0.2.14" }
rlx-onnx-import = { version = "^0.2.14" }
rlx-mlx-io = { version = "^0.2.14" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.7"
half = { version = "2", features = ["bytemuck"] }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
llama-cpp-2 = { version = "0.1.146", default-features = false, features = ["openmp"] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
candle-core = { version = "0.10.2", default-features = false }
candle-nn = { version = "0.10.2" }
candle-transformers = { version = "0.10.2" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
criterion = { version = "0.5", features = ["html_reports"] }
rten = { version = "0.24", default-features = false }
rten-tensor = { version = "0.24" }
rten-imageproc = { version = "0.24" }
ocrs = { version = "0.12.2", default-features = false }
flate2 = "1"

rlx-cli = { path = "crates/rlx-cli", version = "0.2.14" }
rlx-core = { path = "crates/rlx-models-core", package = "rlx-models-core", version = "0.2.14" }
rlx-eval = { path = "crates/rlx-eval", version = "0.2.14" }
rlx-assets = { path = "crates/rlx-assets", version = "0.2.14" }
# Consolidated into ../rlx (crates/core/rlx-distributed); redirected to the local
