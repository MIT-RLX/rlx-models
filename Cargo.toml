[workspace.lints.rust]
unused = { level = "warn" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
manual_range_contains = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"           # graph/weight-loader signatures are intentionally rich
large_enum_variant = "allow"        # cold model/session enums; boxing adds churn, no hot-path win
upper_case_acronyms = "allow"

# Decomposed Kitten graph is a single huge `graph.rs`; faster rebuilds than workspace defaults.
[profile.dev.package.kitten_tts_mini_rlx]
debug = 0
opt-level = 1
codegen-units = 32

[profile.release.package.kitten_tts_mini_rlx]
opt-level = 2
codegen-units = 32

# NOTE: no `[patch.crates-io]` in this committed manifest. To develop against a
# local sibling `../rlx` checkout, run `just link-local` (writes the gitignored
# `.cargo/config.toml` from `.cargo/config.toml.example`); `just unlink` reverts
# to the published `=0.2.x` crates. See the "Local rlx development" recipes.
