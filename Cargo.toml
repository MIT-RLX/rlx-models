# rlx-mamba-bench is an opt-in head-to-head bench against burn-mamba.
# It pulls in the entire burn dep graph, so we keep it out of the
# default workspace build. Run with: `cargo bench --manifest-path
# crates/rlx-mamba-bench/Cargo.toml`.
#
exclude = [
    "crates/rlx-mamba-bench",
    # Auto-generated ONNX decompose bench; publish = false, opt-in manifest-path builds.
    "crates/bench_matmul_rlx",
]

[workspace.package]
version       = "0.2.13"
edition       = "2024"
rust-version  = "1.87"
license       = "GPL-3.0-only"
authors       = ["Eugene Hauptmann", "Nataliya Kosmyna"]
repository    = "https://github.com/MIT-RLX/rlx-models"
homepage      = "https://github.com/MIT-RLX/rlx-models"
documentation = "https://docs.rs/rlx-models"
keywords      = ["ml", "tensor", "compiler", "neural-network"]
categories    = ["science", "algorithms"]

[workspace.dependencies]
# Published `rlx*` (crates.io 0.2.13). Crates use `{ workspace = true }`.
# Local ../rlx override: `.cargo/config.toml` from `.cargo/config.toml.example` (gitignored).
# `rlx-distributed` needs rlx-driver 0.2.13+ (`ProcessGroup`, `TcpTransport`, …).
# Publish / CI without patch: requires rlx 0.2.13 on crates.io.
rlx = { version = "^0.2.13", default-features = false, features = ["cpu"] }
rlx-ir = { version = "^0.2.13" }
rlx-flow = { version = "^0.2.13" }
rlx-runtime = { version = "^0.2.13", default-features = false, features = ["cpu"] }
rlx-driver = { version = "^0.2.13" }
rlx-opt = { version = "^0.2.13" }
rlx-optim = { version = "^0.2.13" }
rlx-autodiff = { version = "^0.2.13" }
rlx-compile = { version = "^0.2.13" }
rlx-fusion = { version = "^0.2.13" }
rlx-cpu = { version = "^0.2.13" }
rlx-gguf = { version = "^0.2.13" }
rlx-text = { version = "^0.2.13" }
rlx-metal = { version = "^0.2.13" }
rlx-mlx = { version = "^0.2.13" }
rlx-cuda = { version = "^0.2.13" }
rlx-wgpu = { version = "^0.2.13" }
rlx-rocm = { version = "^0.2.13" }
rlx-onnx-import = { version = "^0.2.13" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.7"
half = { version = "2", features = ["bytemuck"] }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
llama-cpp-2 = { version = "0.1.146", default-features = false, features = ["openmp"] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
candle-core = { version = "0.10.2", default-features = false }
