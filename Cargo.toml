[workspace.lints.rust]
unused = { level = "warn" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
manual_range_contains = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
upper_case_acronyms = "allow"

# Decomposed Kitten graph is a single huge `graph.rs`; faster rebuilds than workspace defaults.
[profile.dev.package.kitten_tts_mini_rlx]
debug = 0
opt-level = 1
codegen-units = 32

[profile.release.package.kitten_tts_mini_rlx]
opt-level = 2
codegen-units = 32
