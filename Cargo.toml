[workspace]
resolver = "2"
members = [
    "crates/rlx-models",
    "crates/rlx-cli",
    "crates/rlx-models-core",
    "crates/rlx-sam-ir",
    "crates/rlx-tensor",
    "crates/rlx-bert",
    "crates/rlx-clinicalbert",
    "crates/rlx-nomic",
    "crates/rlx-vision",
    "crates/rlx-dinov2",
    "crates/rlx-embed",
    "crates/rlx-sam",
    "crates/rlx-sam2",
    "crates/rlx-sam3",
    "crates/rlx-qwen3",
    "crates/rlx-llama32",
    "crates/rlx-gemma",
    "crates/rlx-llada2",
    "crates/rlx-qwen35",
    "crates/rlx-flux2",
    "crates/rlx-vjepa2",
    "crates/rlx-wav2vec2-bert",
    "crates/rlx-whisper",
    "crates/rlx-voxtral",
    "crates/rlx-locateanything",
    "crates/rlx-voxtral-tts",
    "crates/rlx-qwen3-tts",
    "crates/rlx-qwen3-tts-train",
    "crates/rlx-voxtral-tts-train",
    "crates/rlx-diamond",
    "crates/rlx-mistral",
    "crates/rlx-bonsai",
    "crates/rlx-minicpm5",
    "crates/rlx-phi",
    "crates/rlx-omnicoder",
    "crates/rlx-granite",
    "crates/rlx-cohere",
    "crates/rlx-llama-base",
    "crates/rlx-minimax",
    "crates/rlx-gpt-oss",
    "crates/rlx-nemotron",
    "crates/rlx-lfm",
    "crates/rlx-glm",
    "crates/rlx-ssm",
    "crates/rlx-vlm-base",
    "crates/rlx-qwen3-vl",
    "crates/rlx-lfm-vl",
    "crates/rlx-nemotron-omni",
    "crates/rlx-ocr",
    "crates/rlx-neutts",
    "crates/rlx-kittentts",
    "crates/rlx-onnx-decompose",
    "crates/kitten_tts_mini_rlx",
    "crates/rlx-mamba",
    "crates/rlx-fft",
    "crates/rlx-vad",
]

# rlx-mamba-bench is an opt-in head-to-head bench against burn-mamba.
# It pulls in the entire burn dep graph, so we keep it out of the
# default workspace build. Run with: `cargo bench --manifest-path
# crates/rlx-mamba-bench/Cargo.toml`.
#
exclude = [
    "crates/rlx-mamba-bench",
    # Auto-generated ONNX decompose bench; publish = false, opt-in manifest-path builds.
    "crates/bench_matmul_rlx",
]

[workspace.package]
version       = "0.2.6"
edition       = "2024"
rust-version  = "1.87"
license       = "GPL-3.0-only"
authors       = ["Eugene Hauptmann", "Nataliya Kosmyna"]
repository    = "https://github.com/MIT-RLX/rlx-models"
homepage      = "https://github.com/MIT-RLX/rlx-models"
documentation = "https://docs.rs/rlx-models"
keywords      = ["ml", "tensor", "compiler", "neural-network"]
categories    = ["science", "algorithms"]

[workspace.dependencies]
# Published `rlx*` (crates.io 0.2.6). Crates use `{ workspace = true }`.
# Local ../rlx override: `.cargo/config.toml` from `.cargo/config.toml.example` (gitignored).
# Publish / CI: no config.toml → resolves from crates.io only.
rlx = { version = "=0.2.6", default-features = false, features = ["cpu"] }
rlx-ir = { version = "=0.2.6" }
rlx-flow = { version = "=0.2.6" }
rlx-runtime = { version = "=0.2.6", default-features = false, features = ["cpu"] }
rlx-opt = { version = "=0.2.6" }
rlx-autodiff = { version = "=0.2.6" }
rlx-compile = { version = "=0.2.6" }
rlx-fusion = { version = "=0.2.6" }
rlx-cpu = { version = "=0.2.6" }
rlx-gguf = { version = "=0.2.6" }
rlx-text = { version = "=0.2.6" }
rlx-metal = { version = "=0.2.6" }
rlx-mlx = { version = "=0.2.6" }
rlx-cuda = { version = "=0.2.6" }
rlx-wgpu = { version = "=0.2.6" }
rlx-rocm = { version = "=0.2.6" }
rlx-onnx-import = { version = "=0.2.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.7"
half = { version = "2", features = ["bytemuck"] }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
llama-cpp-2 = { version = "0.1.146", default-features = false, features = ["openmp"] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
candle-core = { version = "0.10.2", default-features = false }
candle-nn = { version = "0.10.2" }
candle-transformers = { version = "0.10.2" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
criterion = { version = "0.5", features = ["html_reports"] }
rten = { version = "0.24", default-features = false }
rten-tensor = { version = "0.24" }
rten-imageproc = { version = "0.24" }
ocrs = { version = "0.12.2", default-features = false }

rlx-cli = { path = "crates/rlx-cli", version = "0.2.6" }
rlx-core = { path = "crates/rlx-models-core", package = "rlx-models-core", version = "0.2.6" }
kitten_tts_mini_rlx = { path = "crates/kitten_tts_mini_rlx", version = "0.2.7" }
rlx-sam-ir = { path = "crates/rlx-sam-ir", version = "0.2.6" }
rlx-tensor = { path = "crates/rlx-tensor", version = "0.2.6" }
rlx-bert = { path = "crates/rlx-bert", version = "0.2.6" }
