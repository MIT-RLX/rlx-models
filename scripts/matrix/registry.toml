# =========================================================================== TTS (ORT-backed)
[[models]]
name = "kokoro"
package = "rlx-kokoro"
kind = "tts"
tier = 1
bin = "rlx-kokoro"
template = "tts_text"
features_base = ["hf-download", "espeak"]
weights = { path = "weights/tts/kokoro-82m" }
download = { mode = "flag" }
extra = "--data weights/tts/kokoro-82m --voice af_heart"
validate = { rule = "tts", coverage_pass = 0.6, coverage_warn = 0.4, cosine_pass = 0.90, cosine_warn = 0.70 }
license = { nc = false, gated = false }

[[models]]
name = "supertonic"
package = "rlx-supertonic"
kind = "tts"
tier = 1
bin = "rlx-supertonic"
template = "tts_text"
features_base = ["hf-download"]
weights = { path = "weights/tts/supertonic-3" }
download = { mode = "flag" }
extra = "--data weights/tts/supertonic-3"
# Force true Vulkan (default remaps Vulkan→CUDA). Expected fail until numerics match.
env = { vulkan = { RLX_SUPERTONIC_VULKAN = "1" } }
validate = { rule = "tts", coverage_pass = 0.6, coverage_warn = 0.4, cosine_pass = 0.90, cosine_warn = 0.70 }
license = { nc = false, gated = false }

[[models]]
name = "piper"
package = "rlx-piper"
kind = "tts"
tier = 1
bin = "rlx-piper"
template = "tts_text"
features_base = []
weights = { path = "weights/tts/piper" }
download = { mode = "none" }
extra = "--data weights/tts/piper"
# Zero SDP/z noise so CPU↔GPU cosine is meaningful (noise is seeded but ceil(dur) amplifies).
env = { RLX_PIPER_DETERMINISTIC = "1" }
validate = { rule = "tts", coverage_pass = 0.5, coverage_warn = 0.3, cosine_pass = 0.90, cosine_warn = 0.70 }
license = { nc = false, gated = false }

[[models]]
name = "moss-nano"
package = "rlx-moss-nano"
kind = "tts"
tier = 1
bin = "rlx-moss-nano"
template = "tts_text"
features_base = ["onnx"]
weights = { path = "weights/tts/moss-nano" }
download = { mode = "none" }
# CPU prefill is multi-minute on fox; short text + compact voice keeps the
# harness under timeout while still exercising CUDA prefill + codec.
inputs = { text = "Hi there friends." }
extra = "--data weights/tts/moss-nano --voice Saki --max-frames 32"
validate = { rule = "tts", coverage_pass = 0.5, coverage_warn = 0.3, cosine_pass = 0.90, cosine_warn = 0.70 }
license = { nc = false, gated = false }
notes = "CUDA prefill on-device by default; codec CPU unless RLX_MOSS_CODEC_DEVICE=gpu"

