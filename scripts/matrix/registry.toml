# =========================================================================== LM (Bonsai-27B Q1_0)
[[models]]
name = "bonsai-27b"
package = "rlx-qwen35"
kind = "lm"
tier = 2
bin = "rlx-qwen35"
template = "lm"
features_base = []
weights = { path = "weights/Bonsai-27B-gguf/Bonsai-27B-Q1_0.gguf" }
download = { mode = "none" }
extra = "--packed --prompt \"Question: What is the capital of France? Answer:\""
# 16GB laptop: keep packed + short max-seq so the decode arena fits.
gpu_extra = { cuda = "--max-seq 32" }
max_tokens = "16"
validate = { rule = "lm", min_new_tokens = 4, parity_prefix = 4 }
license = { nc = false, gated = false }
notes = "prism-ml Q1_0 packed; needs ~16GB+ CUDA; sync weights separately"

