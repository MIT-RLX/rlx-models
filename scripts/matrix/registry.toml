# Cross-backend harness registry — the single source of truth.
#
# Each [[models]] stanza is PLATFORM-NEUTRAL: it only describes what is intrinsic to
# the model (package, kind, invocation, weights). The driver (run_matrix.py) decides
# which backends to run from the *host* (host_backends ∩ the crate's declared cargo
# features) — so the same registry runs on the Mac and on msi with no edits.
#
# tier 1 = curated, reliably builds+runs on a Linux+CUDA box (default set).
# tier 2 = attempted only with ALL=1 (NC license / big-VRAM / needs extra assets).
#
# Notes on backends:
#  - Native-rlx models (qwen3, whisper, melotts, dinov2) truly exercise cpu/wgpu/cuda/vulkan.
#  - ORT-backed TTS (kokoro/supertonic/piper/luxtts/zipvoice/moss-nano) are CPU-centric;
#    GPU device strings may be rejected at runtime — the harness records that honestly.

[defaults]
text = "The quick brown fox jumps over the lazy dog near the river bank."
ref = "assets/jfk/jfk_voice_clone.wav"
ref_text = "And so my fellow Americans, ask not what your country can do for you, ask what you can do for your country."
wav = "assets/jfk/jfk_voice_clone.wav"
max_tokens = "24"

[templates]
tts_text  = "{extra} --text \"{text}\" --device {device} --out {out}"
tts_clone = "{extra} --prompt-wav {ref} --prompt-text \"{ref_text}\" --text \"{text}\" --device {device} --out {out}"
# clap bins that use --output / --model-dir instead of --out / --data
tts_output = "{extra} --text \"{text}\" --device {device} --output {out}"
tts_styletts2 = "{extra} --text \"{text}\" --device {device} --output {out}"
tts_sesame = "{extra} --text \"{text}\" --device {device} --output {out}"
tts_chatterbox = "{extra} --ref-wav {ref} --text \"{text}\" --device {device} --out {out}"
tts_f5 = "{extra} --ref-wav {ref} --ref-text \"{ref_text}\" --text \"{text}\" --device {device} --out {out}"
# stream tokens to stdout (no --no-stream): the callback only prints when streaming,
# which is what the lm validator parses for non-degeneracy + cpu-vs-gpu token parity.
lm        = "--weights {weights} --device {device} {extra} --max-tokens {max_tokens}"
asr       = "--weights {weights} {extra} --wav {wav} --device {device} --language en --output {out}"
vision    = "--weights {weights} --device {device} {extra}"

# =========================================================================== LM (native rlx)
[[models]]
name = "qwen3-0.6b"
package = "rlx-qwen3"
kind = "lm"
tier = 1
bin = "rlx-qwen3"
template = "lm"
features_base = []
weights = { path = "weights/Qwen3-0.6B-gguf/Qwen3-0.6B-Q4_K_M.gguf" }
download = { mode = "none" }
extra = "--prompt-ids 9707,11,1879"
# cuda needs --packed (keeps GGUF weights quantized via Op::DequantMatMul so the
# arena fits 16GB VRAM; the f32-weight path OOMs once decode buckets stack up).
# vulkan handles the f32 path fine and is far faster there, so it stays non-packed.
# wgpu is left non-packed: the packed prefill binding crash was fixed (rlx-wgpu
# gguf_gpu.rs gemv reroute), but wgpu qwen3 still has a pre-existing numerical bug
# and the packed path is too slow, so it fails either way — non-packed fails fast.
gpu_extra = { cuda = "--packed" }
validate = { rule = "lm", min_new_tokens = 8, parity_prefix = 8 }
license = { nc = false, gated = false }

# =========================================================================== ASR (native rlx)
[[models]]
name = "whisper"
package = "rlx-whisper"
kind = "asr"
tier = 1
bin = "rlx-whisper"
template = "asr"
features_base = ["tokenizer"]
weights = { path = ".cache/whisper-tiny/model.safetensors" }
download = { mode = "none" }
# cli derives config as <weights-parent>/config.json, so pass them explicitly.
extra = "--config .cache/whisper-tiny/config.json --tokenizer .cache/whisper-tiny/tokenizer.json"
# whisper requires 16 kHz; the bundled jfk clips are 24 kHz (jfk_16k.wav is resampled).
inputs = { wav = "assets/harness/jfk_16k.wav" }
validate = { rule = "asr", wer_pass = 0.20, wer_warn = 0.50 }
license = { nc = false, gated = false }

# =========================================================================== TTS native rlx
[[models]]
name = "melotts"
package = "rlx-melotts"
kind = "tts"
tier = 1
bin = "rlx-melotts"
template = "tts_text"
features_base = []
# rlx-melotts is a thin wrapper over the tiny-tts engine → uses the tiny-tts bundle.
weights = { path = "weights/tts/melotts" }
download = { mode = "none" }
extra = "--data weights/tts/melotts"
validate = { rule = "tts", coverage_pass = 0.6, coverage_warn = 0.4, cosine_pass = 0.95, cosine_warn = 0.70 }
license = { nc = false, gated = false }

